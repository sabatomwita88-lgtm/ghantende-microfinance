<!DOCTYPE html>
<html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHANTENDE V5 FINAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f3f4f6}button{border:0;border-radius:9px;padding:11px 14px;background:#047857;color:#fff;font-weight:bold;cursor:pointer}i[...]
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#064e3b,#0f766e)}.login-box{width:100%;max-width:420px;background:#[...]
#app{display:none}header{background:#065f46;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.menu{background:#fff;display:flex;gap:6px;padding:8px;border-radius:10px}.menu button{background:#d1fae5;color:#065f46;padding:8px 12px;font-size:12px}.menu button.active{background:#065f46;color:#fff}.form-box,.table-box{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.form-box{display:grid;gap:8px}.searchBox,input,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);text-align:center}.card small{color:#6b7280}.balanceLive{background:#ecfdf5;color:#065f46;padding:12px;border-radius:10px;font-weight:bold;font-size:20px}.customer,.loan,.report{padding:10px;border-bottom:1px solid #ddd}.badge{display:inline-block;padding:4px 8px;border-radius:999px;color:#fff;font-size:10px}.receipt{font-family:monospace;background:#fff;color:#000;padding:15px;border:1px dashed #000;max-width:300px;margin:auto}
#reportModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100}.modal-content{background:#fff;padding:20px;border-radius:12px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto}#mDate{font-weight:bold;color:#065f46;margin-bottom:10px}#mContent{font-size:13px}.modal-buttons{display:flex;gap:10px;margin-top:15px}.modal-buttons button{flex:1}
</style></head><body>
<div id="loginPage"><div class="login-box"><div class="logo">GM</div><h1 style="text-align:center;color:#065f46;margin:0">GHANTENDE</h1><p style="text-align:center;color:#666;font-size:11px">V5.0</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" required><button type="submit">Login</button><div id="message"></div></form></div></div>
<div id="app"><header><h2>GHANTENDE V5</h2><div><button id="exportAllBtn" style="background:#059669;margin-right:4px;font-size:11px">Export</button><button id="logoutButton" style="background:#dc2626;font-size:11px">Logout</button></div></header>
<nav class="menu" style="padding:10px 12px;background:#f5f5f5;border-bottom:1px solid #ddd"><button data-section="dashboard" class="active">Dashboard</button><button data-section="wateja">Wateja</button><button data-section="maombi">Maombi</button><button data-section="mikopo">Mikopo</button><button data-section="marejesho">Marejesho</button><button data-section="ripoti">Ripoti</button><button data-section="smslog">SMS</button><button data-section="maafisa">Maafisa</button></nav>

<section id="dashboard" class="section active"><div class="welcome">Karibu <b id="welcomeEmail"></b> - <span id="todayDate"></span></div>
<div class="cards"><div class="card"><small>Wateja</small><br><strong id="customerCount">0</strong></div><div class="card"><small>Pending</small><br><strong id="pendingCount">0</strong></div><div class="card"><small>Active Loans</small><br><strong id="loanCount">0</strong></div><div class="card"><small>Today Report</small><br><strong id="todayReportBal">TZS 0</strong></div></div>
<div class="table-box"><canvas id="incomeChart" height="120"></canvas></div>
</section>

<section id="wateja" class="section"><h2>Wateja + Mdhamini</h2><div class="form-box"><input id="searchCustomer" class="searchBox" placeholder="Tafuta jina / phone"><select id="filterBranch"><option value="">Vituo Vyote</option><option>Kiriba Branch</option><option>Bwai Branch</option></select></div><div class="table-box"><div id="customersList"></div></div></section>

<section id="maombi" class="section"><h2>Maombi</h2><div class="form-box"><label>Mteja</label><select id="appCustomer"></select><label>Kiasi</label><input id="appAmount" type="number"><label>Miezi</label><input id="appMonths" type="number" value="1"><label>Riba %</label><input id="appInterest" type="number" value="10"><div id="previewTotal" style="font-weight:bold;color:#065f46">TZS 0</div><button id="addAppBtn">Weka Maombi</button></div><div class="table-box"><div id="appList"></div></div></section>

<section id="mikopo" class="section"><h2>Mikopo Active</h2><div class="form-box"><input id="searchLoan" class="searchBox" placeholder="Tafuta mkopo"></div><div class="table-box"><div id="activeLoansList"></div><div id="singleHistory" style="display:none"></div></div></section>

<section id="marejesho" class="section"><h2>Marejesho + Receipt</h2><div class="form-box"><label>Mkopo</label><select id="paymentLoan"></select><label>Kiasi</label><input id="paymentAmount" type="number"><label>Fine</label><input id="paymentFine" type="number" value="0"><label>Tarehe</label><input id="paymentDate" type="date"><button id="payBtn">Hifadhi Payment</button></div><div class="table-box"><div id="paymentsList"></div></div></section>

<section id="ripoti" class="section"><h2>RIPOTI</h2><div class="form-box"><div class="balanceLive"><div id="liveBal">TZS 0</div><small>Salio Live</small></div><label>Tarehe</label><input id="reportDate" type="date"><label>Sales</label><input id="rSales" type="number" value="0"><label>Fine</label><input id="rFine" type="number" value="0"><label>Other Income</label><input id="rOtherIncome" type="number" value="0"><label>MD</label><input id="rMd" type="number" value="0"><label>Store</label><input id="rStore" type="number" value="0"><label>Bank</label><input id="rBank" type="number" value="0"><label>Transport</label><input id="rTransport" type="number" value="0"><label>Food</label><input id="rFood" type="number" value="0"><label>Communication</label><input id="rCommunication" type="number" value="0"><label>Maintenance</label><input id="rMaintenance" type="number" value="0"><label>Other Expense</label><input id="rOtherExpense" type="number" value="0"><button id="saveDailyReport">Hifadhi Ripoti</button><div id="reportMsg"></div></div><div class="table-box"><div id="reportsList">Hakuna</div></div></section>

<section id="smslog" class="section"><h2>SMS Log</h2><div class="table-box"><input id="searchSms" class="searchBox" placeholder="Tafuta SMS"><div id="smsList">Hakuna</div></div></section>

<section id="maafisa" class="section"><h2>Maafisa</h2><div class="form-box"><label>Jina</label><input id="oName"><label>Email</label><input id="oEmail" type="email"><label>Password</label><input id="oPass" type="password"><label>Role</label><select id="oRole"><option>officer</option><option>admin</option></select><label>Phone</label><input id="oPhone"><label>Kituo</label><select id="oBranch"><option value="">--Chagua Kituo--</option><option>Kiriba Branch</option><option>Bwai Branch</option></select><button id="addOfficerBtn">Ongeza Afisa</button><div id="officerMsg"></div></div><div class="table-box"><div id="maafisaList"></div></div></section>
</div>

<div id="reportModal">
  <div class="modal-content">
    <h3 id="mDate"></h3>
    <div id="mContent"></div>
    <div class="modal-buttons">
      <button onclick="printReportModal()">Print</button>
      <button onclick="closeReportModal()" style="background:#6b7280">Funga</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL="https://kvcbsebklyuupwixmagd.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_CaipCB_cvv1uPsqtt4Yalg_cFWGSP2t";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
const money=v=>"TZS "+Number(v||0).toLocaleString();
const esc=v=>String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
let allCustomers=[],allLoans=[],allPayments=[],smsLogs=JSON.parse(localStorage.getItem('smsLogs')||'[]');
let allReportsData=[];
let currentUser={email:'',name:'',branch:'',role:''};
let allBranches=[];

async function loadBranches(){
  const {data}=await supabaseClient.from("branches").select("*").order("name");
  allBranches=data||[{name:'Kiriba Branch'},{name:'Bwai Branch'}];
  const opts='<option value="">--Chagua Kituo--</option>'+allBranches.map(b=>"<option value='"+esc(b.name)+"'>"+esc(b.name)+"</option>").join("");
  if($("oBranch")) $("oBranch").innerHTML=opts;
  if($("filterBranch")) $("filterBranch").innerHTML='<option value="">Vituo Vyote</option>'+opts;
}
function getCurrentOfficerInfo(){return {email:currentUser.email,name:currentUser.name,branch:currentUser.branch};}
function showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));document.querySelector("[data-section='"+id+"']")?.classList.add("active");}
window.showSection=showSection;
function calcLive(){const g=id=>Number($(id)?.value||0);const inc=g("rSales")+g("rFine")+g("rOtherIncome");const exp=g("rMd")+g("rStore")+g("rBank")+g("rTransport")+g("rFood")+g("rCommunication")+g("rMaintenance")+g("rOtherExpense");const bal=inc-exp;$("liveBal").textContent=money(bal);return {inc,exp,bal};}
function updateTotalPreview(){const amt=Number($("appAmount")?.value||0);const months=Number($("appMonths")?.value||1);const rate=Number($("appInterest")?.value||10);const interest=amt*(rate/100)*months;$("previewTotal").textContent=money(amt+interest);}
function saveSmsLog(phone,msg,type){const log={phone,msg,type,date:new Date().toLocaleString()};smsLogs.unshift(log);localStorage.setItem('smsLogs',JSON.stringify(smsLogs.slice(0,200)));}
function renderSmsLog(){const q=($("searchSms")?.value||"").toLowerCase();const filtered=smsLogs.filter(l=>l.phone.toLowerCase().includes(q)||l.msg.toLowerCase().includes(q));$("smsList").innerHTML=!filtered.length?"Hakuna":filtered.map(l=>"<div style='border-bottom:1px solid #ddd;padding:8px'><b>"+esc(l.phone)+"</b> ("+l.type+") "+esc(l.msg)+"<br><small>"+l.date+"</small></div>").join("");}
function isOverdue(loan){const created=new Date(loan.created_at);const due=new Date(created);due.setMonth(due.getMonth()+Number(loan.duration_months||1));return new Date()>due;}

async function loadCustomers(){
  const {data}=await supabaseClient.from("customers").select("*").order("created_at",{ascending:false});
  allCustomers=data||[];
  const q=($("searchCustomer")?.value||"").toLowerCase();
  const bFilter=$("filterBranch")?.value||"";
  let filtered=allCustomers.filter(c=>(c.full_name||"").toLowerCase().includes(q)||(c.phone||"").includes(q));
  if(bFilter) filtered=filtered.filter(c=>c.branch_name===bFilter);
  if(currentUser.role!=='admin' && currentUser.branch){filtered=filtered.filter(c=>c.branch_name===currentUser.branch);}
  $("customerCount").textContent=allCustomers.length;
  $("customersList").innerHTML=!filtered.length?"Hakuna":filtered.map((c,i)=>"<div class='customer'><b>"+(i+1)+". "+esc(c.full_name)+"</b> <span class='badge' style='background:#6b7280'>"+esc(c.branch_name)+"</span> <button onclick='editCustomer(\""+c.id+"\")' style='font-size:11px'>Hariri</button></div>").join("");
  $("appCustomer").innerHTML='<option value="">--Chagua--</option>'+allCustomers.map(c=>"<option value='"+c.id+"'>"+esc(c.full_name)+" - "+esc(c.phone||'')+" ["+esc(c.branch_name||'')+"]</option>").join("");
}
window.editCustomer=async function(id){const c=allCustomers.find(x=>x.id===id);if(!c)return;const newName=prompt("Jina jipya:",c.full_name);if(newName===null)return;const newPhone=prompt("Phone mpya:",c.phone);if(newPhone===null)return;const {error}=await supabaseClient.from("customers").update({full_name:newName,phone:newPhone}).eq("id",id);if(error)alert(error.message);else{alert("Amebadilishwa");loadCustomers();}}

async function loadApplications(){
  const {data}=await supabaseClient.from("loan_applications").select("*").order("created_at",{ascending:false});
  const q=($("searchApp")?.value||"").toLowerCase();
  const filtered=(data||[]).filter(a=>String(a.customer_id||"").includes(q));
  $("appList").innerHTML=!filtered.length?"Hakuna":filtered.map(a=>"<div style='border-bottom:1px solid #ddd;padding:8px'><b>Amount: "+money(a.amount)+"</b> - Status: <span style='background:"+(a.status==='pending'?'#f59e0b':'#10b981')+";color:#fff;padding:2px 6px;border-radius:4px'>"+a.status+"</span><br><button onclick='approveApplication(\""+a.id+"\")' style='font-size:11px'>Idhinisha</button> <button onclick='rejectApplication(\""+a.id+"\")' style='font-size:11px;background:#ef4444'>Kataa</button></div>").join("");
}

async function loadActiveLoans(){
  const {data:loans}=await supabaseClient.from("loans").select("*").eq("loan_status","active").order("created_at",{ascending:false});
  const {data:payments}=await supabaseClient.from("payments").select("*");
  allLoans=loans||[];
  const q=($("searchLoan")?.value||"").toLowerCase();
  const filtered=(loans||[]).filter(l=>(l.customer_name||"").toLowerCase().includes(q));
  $("activeLoansList").innerHTML=!filtered.length?"Hakuna":filtered.map(l=>{const paid=(payments||[]).filter(p=>p.loan_id===l.id).reduce((s,p)=>s+Number(p.amount||0),0);const rem=Number(l.total_amount||0)-paid;const overdue=isOverdue(l);return"<div style='border:1px solid "+(overdue?'#ef4444':'#ddd')+";padding:10px;margin:5px 0;border-radius:6px'><b>"+esc(l.customer_name)+"</b> - "+money(l.total_amount)+" (Paid: "+money(paid)+") Remaining: "+money(rem)+(overdue?"<span style='color:#ef4444'> [OVERDUE]</span>":"")+"<br><button onclick='viewLoanHistory(\""+l.id+"\",\""+esc(l.customer_name)+"\","+l.total_amount+","+paid+","+rem+")' style='font-size:11px'>Historia</button> <button onclick='addFine(\""+l.id+"\")' style='font-size:11px;background:#f59e0b'>Fine</button></div>"}).join("");
}

async function loadPaymentsList(){const {data}=await supabaseClient.from("payments").select("*").order("created_at",{ascending:false}).limit(30);$("paymentsList").innerHTML=!data?.length?"Hakuna":data.map(p=>"<div style='border-bottom:1px solid #ddd;padding:8px'><b>"+money(p.amount)+"</b> - "+p.payment_date+" <button onclick='printReceipt(\""+p.id+"\")' style='font-size:11px'>Receipt</button></div>").join("");}

async function loadReports(){
  const {data}=await supabaseClient.from("daily_reports").select("*").order("report_date",{ascending:false}).limit(30);
  if(!data?.length){$("reportsList").innerHTML="Hakuna";drawChart([]);return;}
  allReportsData=data||[];
  $("reportsList").innerHTML=data.map((r,i)=>"<div class='report' style='padding:10px;border-bottom:1px solid #ddd;cursor:pointer' onclick='openReportModalFromId("+i+")'><b>"+r.report_date+"</b> - "+esc(r.branch_name)+" - "+money(r.balance)+"</div>").join("");
  drawChart(data);
}
function drawChart(reports){const ctx=$("incomeChart");if(!ctx)return;try{if(window.myChart)window.myChart.destroy();window.myChart=new Chart(ctx,{type:'bar',data:{labels:reports.map(r=>r.report_date),datasets:[{label:'Balance',data:reports.map(r=>r.balance),backgroundColor:'#047857'}]},options:{responsive:true,plugins:{legend:{display:false}}}});}catch(e){console.log(e);}}

window.openReportModalFromId=function(idx){
  if(idx<0 || idx>=allReportsData.length) return;
  const r=allReportsData[idx];
  $("mDate").textContent="Ripoti ya "+r.report_date+" - "+esc(r.branch_name);
  const content=`
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <tr><td><b>MAPATO</b></td><td></td></tr>
      <tr><td>Mauzo (Sales)</td><td style="text-align:right">${money(r.sales)}</td></tr>
      <tr><td>Faini (Fine)</td><td style="text-align:right">${money(r.fine)}</td></tr>
      <tr><td>Mapato Mengine</td><td style="text-align:right">${money(r.other_income)}</td></tr>
      <tr style="background:#e5f3e0"><td><b>Jumla Mapato</b></td><td style="text-align:right"><b>${money(r.total_income)}</b></td></tr>
      <tr><td colspan="2"></td></tr>
      <tr><td><b>MATUMIZI</b></td><td></td></tr>
      <tr><td>MD</td><td style="text-align:right">${money(r.md)}</td></tr>
      <tr><td>Store</td><td style="text-align:right">${money(r.store)}</td></tr>
      <tr><td>Bank</td><td style="text-align:right">${money(r.bank)}</td></tr>
      <tr><td>Transport</td><td style="text-align:right">${money(r.transport)}</td></tr>
      <tr><td>Food</td><td style="text-align:right">${money(r.food)}</td></tr>
      <tr><td>Communication</td><td style="text-align:right">${money(r.communication)}</td></tr>
      <tr><td>Maintenance</td><td style="text-align:right">${money(r.maintenance)}</td></tr>
      <tr><td>Other Expense</td><td style="text-align:right">${money(r.other_expense)}</td></tr>
      <tr style="background:#ffe5e5"><td><b>Jumla Matumizi</b></td><td style="text-align:right"><b>${money(r.total_expense)}</b></td></tr>
      <tr><td colspan="2"></td></tr>
      <tr style="background:#e0f2f1"><td><b>SALIO</b></td><td style="text-align:right"><b>${money(r.balance)}</b></td></tr>
      <tr><td colspan="2"></td></tr>
      <tr><td><b>Reported By</b></td><td></td></tr>
      <tr><td>Jina</td><td>${esc(r.reported_by_name)}</td></tr>
      <tr><td>Email</td><td>${esc(r.reported_by_email)}</td></tr>
    </table>
  `;
  $("mContent").innerHTML=content;
  $("reportModal").style.display="flex";
}
window.closeReportModal=function(){ $("reportModal").style.display="none"; }
window.printReportModal=function(){ const modal=$("reportModal"); const w=window.open('','_blank'); w.document.write('<html><head><title>Ripoti</title></head><body>'+modal.innerHTML+'</body></html>'); w.document.close(); w.print(); }
window.viewLoanHistory=async function(loanId,name,total,paid,rem){const el=$("singleHistory");el.style.display="block";el.innerHTML="<h4>"+name+" - "+money(total)+"</h4><p>Paid: "+money(paid)+" | Remaining: "+money(rem)+"</p>";}
window.addFine=async function(loanId){const amt=prompt("Weka Fine:");if(!amt)return;const loan=allLoans.find(l=>l.id===loanId);if(!loan)return;const newTotal=Number(loan.total_amount)+Number(amt);const {error}=await supabaseClient.from("loans").update({total_amount:newTotal}).eq("id",loanId);if(error)alert(error.message);else{alert("Fine imeongezwa");loadActiveLoans();}}
window.approveApplication=async function(id){const {data:appData}=await supabaseClient.from("loan_applications").select("*").eq("id",id).maybeSingle();if(!appData)return alert("Hayapo");const name=(await supabaseClient.from("customers").select("full_name").eq("id",appData.customer_id).maybeSingle()).data?.full_name||"Mteja";const principal=Number(appData.amount||0);const rate=Number(appData.interest_rate||10);const months=Number(appData.duration_months||1);const total=principal+principal*(rate/100)*months;if(!confirm("Approve "+name+" "+money(total)+"?"))return;const officer=getCurrentOfficerInfo();const {error}=await supabaseClient.from("loan_applications").update({status:'approved'}).eq("id",id);if(error)alert(error.message);else{await supabaseClient.from("loans").insert([{customer_id:appData.customer_id,customer_name:name,customer_phone:'',principal_amount:principal,total_amount:total,duration_months:months,interest_rate:rate,loan_status:'active',approved_by_name:officer.name,approved_by_email:officer.email}]);alert(name+" Approved");loadApplications();loadActiveLoans();}}
window.rejectApplication=async function(id){const {error}=await supabaseClient.from("loan_applications").update({status:'rejected'}).eq("id",id);if(error)alert(error.message);else{alert("Application rejected");loadApplications();}}
window.printReceipt=async function(paymentId){const {data:p}=await supabaseClient.from("payments").select("*").eq("id",paymentId).single();if(!p)return;const w=window.open();w.document.write('<pre>GHANTENDE RECEIPT\n====================\nAmount: TZS '+Number(p.amount).toLocaleString()+'\nDate: '+p.payment_date+'\n====================\n</pre>');}

document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("email").value.trim(),password=$("password").value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){$("message").textContent=error.message;return;}const {data:officer}=await supabaseClient.from("officers").select("*").eq("email",email).maybeSingle();currentUser={email:email,name:officer?.full_name||email,branch:officer?.branch_name||'',role:officer?.role||'officer'};localStorage.setItem('currentUser',JSON.stringify(currentUser));$("loginPage").style.display="none";$("app").style.display="block";$("welcomeEmail").textContent=currentUser.name+" ("+currentUser.branch+")";$("todayDate").textContent=new Date().toLocaleDateString("sw-TZ");await loadBranches();await loadCustomers();await loadApplications();await loadActiveLoans();await loadReports();loadOfficers();calcLive();updateTotalPreview();renderSmsLog();});
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();localStorage.removeItem('currentUser');location.reload();});
document.querySelectorAll(".menu button").forEach(b=>b.addEventListener("click",()=>{showSection(b.dataset.section);}));
$("reportDate").value=new Date().toISOString().slice(0,10);$("paymentDate").value=new Date().toISOString().slice(0,10);
["searchCustomer","searchLoan","searchSms"].forEach(id=>{const el=$(id);if(el)el.addEventListener("input",()=>{if(id==="searchCustomer")loadCustomers();if(id==="searchLoan")loadActiveLoans();if(id==="searchSms")renderSmsLog();});});
$("addAppBtn").addEventListener("click",async()=>{const cid=$("appCustomer").value;if(!cid)return alert("Chagua mteja");const amt=Number($("appAmount").value||0);const months=Number($("appMonths").value||1);const rate=Number($("appInterest").value||10);if(!amt)return alert("Weka kiasi");const {error}=await supabaseClient.from("loan_applications").insert([{customer_id:cid,amount:amt,duration_months:months,interest_rate:rate,status:'pending'}]);if(error)alert(error.message);else{alert("Application imeingizwa");$("appAmount").value="";$("appMonths").value="1";$("appInterest").value="10";loadApplications();}});
$("payBtn").addEventListener("click",async()=>{const loanId=$("paymentLoan").value;const amt=Number($("paymentAmount").value||0);const fine=Number($("paymentFine").value||0);const dateVal=$("paymentDate").value;if(!loanId||!amt)return alert("Chagua mkopo na weka amount");const {error}=await supabaseClient.from("payments").insert([{loan_id:loanId,amount:amt,fine:fine,payment_date:dateVal,payment_method:'cash'}]);if(error)alert(error.message);else{alert("Payment imehifadhiwa");$("paymentAmount").value="";$("paymentFine").value="0";loadPaymentsList();loadActiveLoans();}});
$("addOfficerBtn").addEventListener("click",async()=>{const name=$("oName").value.trim();const email=$("oEmail").value.trim();const pass=$("oPass").value.trim();const branch=$("oBranch")?.value||'';if(!email||!pass)return alert("Email na Pass required");if(!branch)return alert("Chagua Kituo cha afisa");const {data:signUp}=await supabaseClient.auth.signUp({email,password:pass});const uid=signUp?.user?.id;const {error:offErr}=await supabaseClient.from("officers").insert([{full_name:name,email,role:$("oRole").value,phone:$("oPhone").value,user_id:uid,branch_name:branch}]);if(offErr)$("officerMsg").textContent=offErr.message;else {$("officerMsg").textContent="Ameongezwa "+branch;loadOfficers();}});
$("saveDailyReport").addEventListener("click",async()=>{const live=calcLive();const officer=getCurrentOfficerInfo();const row={report_date:$("reportDate").value,sales:Number($("rSales").value||0),fine:Number($("rFine").value||0),other_income:Number($("rOtherIncome").value||0),total_income:live.inc,md:Number($("rMd").value||0),store:Number($("rStore").value||0),bank:Number($("rBank").value||0),transport:Number($("rTransport").value||0),food:Number($("rFood").value||0),communication:Number($("rCommunication").value||0),maintenance:Number($("rMaintenance").value||0),other_expense:Number($("rOtherExpense").value||0),total_expense:live.exp,balance:live.bal,branch_name:officer.branch,reported_by_email:officer.email,reported_by_name:officer.name};const {error}=await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date"});if(error){$("reportMsg").textContent=error.message;}else{$("reportMsg").textContent="Imehifadhiwa "+money(row.balance)+" - "+officer.branch+" na "+officer.name;loadReports();}});
async function loadOfficers(){const {data}=await supabaseClient.from("officers").select("*").order("created_at",{ascending:false});$("maafisaList").innerHTML=!data?.length?"Hakuna":data.map(o=>"<div style='border-bottom:1px solid #ddd;padding:8px'><b>"+esc(o.full_name)+"</b> ("+esc(o.email)+") - "+esc(o.branch_name)+" - "+o.role+"</div>").join("");}
$("exportAllBtn").addEventListener("click",()=>{let csv="Type,Name,Phone,Branch,ServedBy,Amount,Total,Balance\n";allCustomers.forEach(c=>{csv+="Customer,"+c.full_name+","+c.phone+","+c.branch_name+",0,0,0\n";});const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ghantende-export.csv';a.click();});
document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("r"))calcLive();if(["appAmount","appMonths","appInterest"].includes(e.target.id))updateTotalPreview();});
</script>
</body></html>
