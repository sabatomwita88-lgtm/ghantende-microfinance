<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GHANTENDE V7 - PART 1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div id="loginPage" class="flex justify-center items-center h-screen bg-gray-900">
<form id="loginForm" class="bg-white p-6 rounded-xl w-11/12 max-w-sm shadow-xl">
<h2 class="text-xl font-bold text-center">GHANTENDE V7</h2><p class="text-center text-sm mb-4">Kiriba & Bwai - Part 1</p>
<input id="email" type="email" class="w-full p-2 border rounded mb-2" placeholder="Email" required>
<input id="password" type="password" class="w-full p-2 border rounded mb-2" placeholder="Password" required>
<button class="w-full bg-gray-900 text-white p-2 rounded">INGIA</button><p id="message" class="text-red-500 text-center"></p>
</form></div>

<div id="app" style="display:none">
<div class="bg-gray-900 text-white p-3 flex justify-between"><span id="welcomeEmail"></span><span id="todayDate"></span><button id="logoutButton" class="bg-red-600 px-2 rounded">TOKA</button></div>
<div class="flex gap-2 p-2 bg-white overflow-auto sticky top-0">
<button data-section="dashboard" class="bg-gray-900 text-white px-3 py-1 rounded active">Dashboard</button>
<button data-section="customers" class="bg-gray-200 px-3 py-1 rounded">Wateja</button>
<button data-section="maombi" class="bg-gray-200 px-3 py-1 rounded">Maombi</button>
<button data-section="mikopo" class="bg-gray-200 px-3 py-1 rounded">Mikopo</button>
<button data-section="malipo" class="bg-gray-200 px-3 py-1 rounded">Malipo</button>
<button data-section="ripoti" class="bg-gray-200 px-3 py-1 rounded">Ripoti</button>
</div>

<div id="dashboard" class="section p-3">
<div class="grid grid-cols-2 gap-2">
<div class="bg-white p-3 rounded text-center"><b id="customerCount">0</b><br>Wateja</div>
<div class="bg-white p-3 rounded text-center"><b id="activeLoanCount">0</b><br>Active</div>
<div class="bg-white p-3 rounded text-center"><b id="loanBalance">0</b><br>Salio</div>
<div class="bg-white p-3 rounded text-center"><b id="overdueCount">0</b><br>Overdue</div>
</div>
<select id="filterBranch" class="w-full mt-3 p-2 border rounded"><option value="">Vituo Vyote</option><option>Kiriba Branch</option><option>Bwai Branch</option></select>
</div>

<div id="customers" class="section hidden p-3">
<h3 class="font-bold">Sajili Mteja - Part 2 Vituo</h3>
<input id="cName" class="w-full p-2 border rounded mt-1" placeholder="Jina kamili">
<input id="cPhone" class="w-full p-2 border rounded mt-1" placeholder="Phone">
<input id="cNumber" class="w-full p-2 border rounded mt-1" placeholder="Namba ya Mteja">
<input id="cGuarantorName" class="w-full p-2 border rounded mt-1" placeholder="Mdhamini">
<input id="cGuarantorPhone" class="w-full p-2 border rounded mt-1" placeholder="Phone Mdhamini">
<select id="cBranch" class="w-full p-2 border rounded mt-1"><option value="">--Chagua Kituo--</option><option>Kiriba Branch</option><option>Bwai Branch</option></select>
<button id="addCustomerBtn" class="w-full bg-blue-600 text-white p-2 rounded mt-2">HIFADHI + SERVED BY</button>
<input id="searchCustomer" class="w-full p-2 border rounded mt-3" placeholder="Tafuta..."><div id="customersList" class="mt-2"></div>
</div>

<div id="maombi" class="section hidden p-3">
<select id="appCustomer" class="w-full p-2 border rounded"></select>
<input id="appAmount" type="number" class="w-full p-2 border rounded mt-1" placeholder="Kiasi">
<input id="appMonths" type="number" value="1" class="w-full p-2 border rounded mt-1">
<input id="appInterest" type="number" value="10" class="w-full p-2 border rounded mt-1">
<div id="totalPreview" class="bg-white p-2 rounded mt-1"></div>
<button id="addAppBtn" class="w-full bg-gray-900 text-white p-2 rounded mt-2">TUMA OMBI</button>
<div id="applicationsList" class="mt-2"></div>
</div>

<!-- PART 2 ITAENDELEA HAPA -->
<div id="mikopo" class="section hidden p-3"><input id="searchLoan" class="w-full p-2 border rounded" placeholder="Tafuta mkopo"><div id="activeLoansList" class="mt-2"></div><div id="singleHistory" style="display:none" class="bg-white p-3 rounded mt-2"></div></div>
<div id="malipo" class="section hidden p-3"><select id="paymentLoan" class="w-full p-2 border rounded"></select><input id="paymentAmount" type="number" class="w-full p-2 border rounded mt-1" placeholder="Kiasi"><input id="paymentFine" type="number" value="0" class="w-full p-2 border rounded mt-1" placeholder="Fine"><input id="paymentDate" type="date" class="w-full p-2 border rounded mt-1"><select id="paymentMethod" class="w-full p-2 border rounded mt-1"><option>M-Pesa</option><option>Cash</option><option>Bank</option></select><button id="payBtn" class="w-full bg-green-600 text-white p-2 rounded mt-2">HIFADHI + AUTO RIPOTI</button><div id="paymentsList" class="mt-2"></div><div id="receiptArea" style="display:none"></div></div>
<div id="ripoti" class="section hidden p-3"><input id="reportDate" type="date" class="w-full p-2 border rounded"><div class="grid grid-cols-2 gap-2 mt-2"><input id="rSales" type="number" placeholder="Mauzo auto" class="p-2 border rounded"><input id="rFine" type="number" placeholder="Faini auto" class="p-2 border rounded"><input id="rOtherIncome" type="number" placeholder="Mapato mengine" class="p-2 border rounded"><input id="rMd" type="number" placeholder="MD" class="p-2 border rounded"><input id="rStore" type="number" placeholder="Store" class="p-2 border rounded"><input id="rBank" type="number" placeholder="Bank" class="p-2 border rounded"><input id="rTransport" type="number" placeholder="Transport" class="p-2 border rounded"><input id="rFood" type="number" placeholder="Chakula" class="p-2 border rounded"><input id="rCommunication" type="number" placeholder="Mawasiliano" class="p-2 border rounded"><input id="rMaintenance" type="number" placeholder="Matengenezo" class="p-2 border rounded"><input id="rOtherExpense" type="number" placeholder="Mengine" class="p-2 border rounded"><input id="rMikopo" type="number" placeholder="MIKOPO ILIYOTOLEWA auto" class="p-2 border rounded bg-red-50 border-red-300 col-span-2"></div><div class="bg-white p-2 rounded mt-2 text-center">Salio Live: <b id="liveBal">0</b></div><button id="saveDailyReport" class="w-full bg-gray-900 text-white p-2 rounded mt-2">HIFADHI RIPOTI + BRANCH + SERVED BY</button><p id="reportMsg"></p><div id="dailyDetails" style="display:none" class="bg-white p-3 rounded mt-2 border-2 border-green-600"></div><div id="reportsList" class="mt-2"></div></div>
</div>
<script>
// hapa ndipo code ya JS ya Part 1 + Part 2 itaunganishwa
const SUPABASE_URL="https://kvcbsebklyuupwixmagd.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_CaipCB_cvv1uPsqtt4Yalg_cFWGSP2t";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);const money=v=>"TZS "+Number(v||0).toLocaleString();const esc=v=>String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));let currentUser={email:'',name:'',branch:'',role:''};let allCustomers=[],allLoans=[],allPayments=[];
function showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.add("hidden"));$(id).classList.remove("hidden");}
function calcLive(){const g=id=>Number($(id)?.value||0);const inc=g("rSales")+g("rFine")+g("rOtherIncome");const exp=g("rMd")+g("rStore")+g("rBank")+g("rTransport")+g("rFood")+g("rCommunication")+g("rMaintenance")+g("rOtherExpense")+g("rMikopo");if($("liveBal"))$("liveBal").textContent=money(inc-exp);return{inc,exp,bal:inc-exp};}
async function autoAddToReport(field,amount){const today=new Date().toISOString().slice(0,10);const {data:existing}=await supabaseClient.from("daily_reports").select("*").eq("report_date",today).eq("branch_name",currentUser.branch).maybeSingle();let row=existing||{report_date:today,branch_name:currentUser.branch,reported_by_email:currentUser.email,reported_by_name:currentUser.name,sales:0,fine:0,other_income:0,md:0,store:0,bank:0,transport:0,food:0,communication:0,maintenance:0,other_expense:0,mikopo_iliyotolewa:0};row[field]=Number(row[field]||0)+Number(amount);row.total_income=Number(row.sales||0)+Number(row.fine||0)+Number(row.other_income||0);row.total_expense=Number(row.md||0)+Number(row.store||0)+Number(row.bank||0)+Number(row.transport||0)+Number(row.food||0)+Number(row.communication||0)+Number(row.maintenance||0)+Number(row.other_expense||0)+Number(row.mikopo_iliyotolewa||0);row.balance=row.total_income-row.total_expense;await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date,branch_name"});loadReports();}
document.querySelectorAll("[data-section]").forEach(b=>b.addEventListener("click",()=>showSection(b.dataset.section)));
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("email").value.trim(),pass=$("password").value;$("message").textContent="Inaingia...";const {data,error}=await supabaseClient.auth.signInWithPassword({email,password:pass});if(error){$("message").textContent=error.message;return;}const {data:officer}=await supabaseClient.from("officers").select("*").eq("email",email).maybeSingle();currentUser={email,name:officer?.full_name||email,branch:officer?.branch_name||'Kiriba Branch',role:officer?.role||'officer'};$("loginPage").style.display="none";$("app").style.display="block";$("welcomeEmail").textContent=currentUser.name+" ("+currentUser.branch+")";$("todayDate").textContent=new Date().toLocaleDateString();$("reportDate").value=new Date().toISOString().slice(0,10);$("paymentDate").value=new Date().toISOString().slice(0,10);loadCustomers();loadApplications();loadActiveLoans();loadReports();});
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.reload();});
document.addEventListener("input",e=>{if(e.target.id?.startsWith("r"))calcLive();});
async function loadCustomers(){const {data}=await supabaseClient.from("customers").select("*").order("created_at",{ascending:false});allCustomers=data||[];const q=($("searchCustomer")?.value||"").toLowerCase();const b=$("filterBranch")?.value||"";let f=allCustomers.filter(c=>(c.full_name||"").toLowerCase().includes(q));if(b)f=f.filter(c=>c.branch_name===b);if(currentUser.role!=='admin'&&currentUser.branch)f=f.filter(c=>c.branch_name===currentUser.branch);$("customerCount").textContent=allCustomers.length;$("customersList").innerHTML=f.map((c,i)=>`<div class='bg-white p-2 rounded mb-2'><b>${i+1}. ${esc(c.full_name)}</b> <span class='bg-gray-500 text-white text-xs px-2 rounded'>${esc(c.branch_name||'')}</span><br><small style='color:#059669'>Served by: ${esc(c.served_by_name||'--')}</small></div>`).join("");$("appCustomer").innerHTML='<option>--Chagua--</option>'+allCustomers.map(c=>`<option value='${c.id}'>${esc(c.full_name)} [${esc(c.branch_name||'')}]</option>`).join("");}
async function loadApplications(){const {data}=await supabaseClient.from("loan_applications").select("*").order("created_at",{ascending:false});$("pendingCount").textContent=(data||[]).filter(a=>a.status==='pending').length;$("applicationsList").innerHTML=(data||[]).map((a,i)=>{const isP=a.status==='pending';return `<div class='bg-white p-2 rounded mb-2 border-l-4 ${a.status==='approved'?'border-green-600':a.status==='rejected'?'border-red-600':'border-yellow-600'}'><b>Ombi ${i+1}</b> - ${money(a.total_amount)} ${esc(a.status)} ${isP?`<div class='flex gap-2 mt-1'><button onclick="approveApplication('${a.id}')" class='bg-green-600 text-white px-2 py-1 rounded flex-1'>APPROVE</button><button onclick="rejectApplication('${a.id}')" class='bg-red-600 text-white px-2 py-1 rounded flex-1'>REJECT</button></div>`:''}</div>`}).join("");}
async function loadActiveLoans(){const {data:loans}=await supabaseClient.from("loans").select("*").eq("loan_status","active").order("created_at",{ascending:false});const {data:payments}=await supabaseClient.from("payments").select("*");allLoans=loans||[];allPayments=payments||[];const {data:customers}=await supabaseClient.from("customers").select("id,branch_name");const cmap={};(customers||[]).forEach(c=>cmap[c.id]=c.branch_name);let bal=0;const b=$("filterBranch")?.value||"";let filtered=allLoans;if(b)filtered=filtered.filter(l=>cmap[l.customer_id]===b);if(currentUser.role!=='admin'&&currentUser.branch)filtered=filtered.filter(l=>cmap[l.customer_id]===currentUser.branch);filtered.forEach(l=>{let paid=0;allPayments.forEach(p=>{if(p.loan_id===l.id)paid+=Number(p.amount||0)});bal+=Number(l.total_amount||0)-paid;});$("loanBalance").textContent=money(bal);$("activeLoanCount").textContent=allLoans.length;$("activeLoansList").innerHTML=filtered.map((l,i)=>{let paid=0;allPayments.forEach(p=>{if(p.loan_id===l.id)paid+=Number(p.amount||0)});return `<div class='bg-white p-2 rounded mb-2'><b>${i+1}. ${esc(l.customer_name)}</b> Salio <b style='color:red'>${money(Number(l.total_amount||0)-paid)}</b><br><small>Imeidhinishwa na: ${esc(l.approved_by_name||'--')}</small></div>`}).join("");$("paymentLoan").innerHTML='<option>--Chagua--</option>'+allLoans.map(l=>{let p=0;allPayments.forEach(x=>{if(x.loan_id===l.id)p+=Number(x.amount||0)});return `<option value='${l.id}'>${esc(l.customer_name)} - ${money(Number(l.total_amount||0)-p)}</option>`}).join("");}
async function loadReports(){const {data}=await supabaseClient.from("daily_reports").select("*").order("report_date",{ascending:false}).limit(20);$("reportsList").innerHTML=(data||[]).map(r=>`<div class='bg-white p-2 rounded mb-2' onclick="showDailyDetails('${r.report_date}','${esc(r.branch_name||'')}')" style='cursor:pointer'><b>${r.report_date}</b> <span class='bg-green-600 text-white text-xs px-2 rounded'>${esc(r.branch_name||'')}</span> <small>Bofya kuona marejesho</small><br>Mapato:${money(r.total_income)} | Mikopo:${money(r.mikopo_iliyotolewa||0)} | <b>Salio:${money(r.balance)}</b><br><small>Na: ${esc(r.reported_by_name||'')}</small></div>`).join("");}
window.showDailyDetails=async function(date,branch){const el=$("dailyDetails");el.style.display="block";el.innerHTML=`Inapakia ${date}...`;const {data:payments}=await supabaseClient.from("payments").select("*").eq("payment_date",date).order("created_at",{ascending:false});let total=0;let html=`<div class='flex justify-between'><h3 class='font-bold'>Marejesho ${date} - ${branch}</h3><button onclick="this.parentElement.parentElement.style.display='none'" class='bg-gray-200 px-2 rounded'>X</button></div>`;if(!payments?.length)html+=`<p class='text-center'>Hakuna marejesho</p>`;else{html+=payments.map((p,i)=>{total+=Number(p.amount||0)+Number(p.fine_amount||0);return `<div class='flex justify-between py-1 border-b'><span>${i+1}. ${p.payment_method} ${new Date(p.created_at).toLocaleTimeString()}</span><b>${money(p.amount)}</b></div>`}).join("");html+=`<div class='bg-gray-900 text-white p-2 rounded mt-2 text-center'>JUMLA: <b>${money(total)}</b> - Marejesho ${payments.length}</div>`;}el.innerHTML=html;el.scrollIntoView();}
window.approveApplication=async function(id){const {data:appData}=await supabaseClient.from("loan_applications").select("*").eq("id",id).maybeSingle();const principal=Number(appData.amount||0);const total=Number(appData.total_amount||0);const {data:cust}=await supabaseClient.from("customers").select("full_name").eq("id",appData.customer_id).maybeSingle();const name=cust?.full_name||'Mteja';if(!confirm(`Approve ${name} ${money(total)}?`))return;await supabaseClient.from("loan_applications").update({status:'approved'}).eq("id",id);await supabaseClient.from("loans").insert([{customer_id:appData.customer_id,customer_name:name,loan_amount:principal,interest_amount:Number(appData.interest_amount||0),total_amount:total,loan_status:'active',duration_months:Number(appData.duration_months||1),interest_rate:Number(appData.interest_rate||10),approved_by_email:currentUser.email,approved_by_name:currentUser.name}]);await autoAddToReport('mikopo_iliyotolewa',principal);loadApplications();loadActiveLoans();loadReports();}
window.rejectApplication=async function(id){await supabaseClient.from("loan_applications").update({status:'rejected'}).eq("id",id);loadApplications();}
$("addCustomerBtn").addEventListener("click",async()=>{const branch=$("cBranch").value||currentUser.branch;if(!$("cName").value.trim())return alert("Jina required");await supabaseClient.from("customers").insert([{full_name:$("cName").value,phone:$("cPhone").value,customer_number:$("cNumber").value,guarantor_name:$("cGuarantorName").value,guarantor_phone:$("cGuarantorPhone").value,branch_name:branch,served_by_email:currentUser.email,served_by_name:currentUser.name}]);alert(`Amehifadhiwa ${branch} na ${currentUser.name}`);loadCustomers();});
$("addAppBtn").addEventListener("click",async()=>{const cid=$("appCustomer").value;if(!cid)return;const amt=Number($("appAmount").value||0);const m=Number($("appMonths").value||1);const r=Number($("appInterest").value||10);const interest=amt*(r/100)*m;const total=amt+interest;await supabaseClient.from("loan_applications").insert([{customer_id:cid,amount:amt,duration_months:m,interest_rate:r,interest_amount:interest,total_amount:total,status:'pending'}]);loadApplications();});
$("payBtn").addEventListener("click",async()=>{const loanId=$("paymentLoan").value;const amt=Number($("paymentAmount").value||0);const fine=Number($("paymentFine").value||0);if(!loanId||!amt)return;await supabaseClient.from("payments").insert([{loan_id:loanId,amount:amt,payment_date:$("paymentDate").value,payment_method:$("paymentMethod").value,fine_amount:fine}]);await autoAddToReport('sales',amt);if(fine>0)await autoAddToReport('fine',fine);alert(`Malipo ${money(amt)} yameingia auto ${currentUser.branch}`);loadActiveLoans();loadReports();});
$("saveDailyReport").addEventListener("click",async()=>{const live=calcLive();const row={report_date:$("reportDate").value,sales:Number($("rSales").value||0),fine:Number($("rFine").value||0),other_income:Number($("rOtherIncome").value||0),total_income:live.inc,md:Number($("rMd").value||0),store:Number($("rStore").value||0),bank:Number($("rBank").value||0),transport:Number($("rTransport").value||0),food:Number($("rFood").value||0),communication:Number($("rCommunication").value||0),maintenance:Number($("rMaintenance").value||0),other_expense:Number($("rOtherExpense").value||0),mikopo_iliyotolewa:Number($("rMikopo").value||0),total_expense:live.exp,balance:live.bal,branch_name:currentUser.branch,reported_by_email:currentUser.email,reported_by_name:currentUser.name};await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date,branch_name"});$("reportMsg").textContent=`Imehifadhiwa ${money(row.balance)}`;loadReports();});
</script></body></html>
