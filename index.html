<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GHANTENDE V3.2 FINAL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:linear-gradient(135deg,#064e3b,#0f766e)}button{border:0;border-radius:9px;padding:12px 16px;background:#047857;color:#fff;font-weight:bold;cursor:pointer}input,select,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;margin:6px 0 14px}label{font-weight:bold;font-size:13px}#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{width:100%;max-width:410px;background:#fff;border-radius:18px;padding:30px 24px}.logo{width:75px;height:75px;margin:0 auto 15px;border-radius:50%;background:#047857;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold}#app{display:none;min-height:100vh;background:#f3f4f6}header{background:#065f46;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0}header h2{margin:0;font-size:19px}.logout{background:#dc2626}.menu{background:#fff;display:flex;gap:8px;padding:10px;overflow-x:auto;border-bottom:1px solid #ddd}.menu button{background:#e5e7eb;color:#222;white-space:nowrap}.menu button.active{background:#047857;color:#fff}.section{display:none;padding:18px;max-width:1100px;margin:auto}.section.active{display:block}.welcome{background:#047857;color:#fff;padding:16px;border-radius:13px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;padding:19px;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);cursor:pointer}.card h3{margin:0 0 8px;color:#555}.card strong{font-size:24px;color:#047857}.form-box,.table-box{background:#fff;padding:18px;border-radius:14px;margin-top:10px}.balanceLive{background:linear-gradient(90deg,#059669,#2563eb);color:#fff;text-align:center;border-radius:14px;padding:18px;margin-bottom:14px}.balanceLive div{font-size:28px;font-weight:bold}.customer,.application{padding:14px 0;border-bottom:1px solid #ddd}.delete-btn{background:#dc2626}.edit-btn{background:#2563eb}</style></head><body>
<div id="loginPage"><div class="login-box"><div class="logo">GM</div><h1 style="text-align:center;color:#065f46">GHANTENDE</h1><p style="text-align:center;color:#666">V3.2 FINAL - AUTO RIPOTI + TUMA BOSI</p><form id="loginForm"><label>Gmail</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button style="width:100%" type="submit">INGIA</button><div id="message" style="text-align:center;margin-top:10px;font-weight:bold"></div></form></div></div>
<div id="app"><header><h2>GHANTENDE</h2><button id="logoutButton" class="logout">TOKA</button></header><div class="menu"><button class="active" data-section="dashboard">Dashboard</button><button data-section="wateja">Wateja</button><button data-section="maombi">Maombi</button><button data-section="mikopo">Mikopo</button><button data-section="marejesho">Marejesho</button><button data-section="ratiba">Ratiba</button><button data-section="ripoti">Ripoti</button><button data-section="maafisa">Maafisa</button></div>

<section id="dashboard" class="section active"><div class="welcome">Karibu <b id="welcomeEmail"></b><div id="adminBadge" style="display:none;margin-top:10px;background:#ecfdf5;color:#065f46;padding:8px;border-radius:8px">ADMIN: <span id="adminName"></span></div></div><div class="cards"><div class="card"><h3>Wateja</h3><strong id="customerCount">0</strong></div><div class="card"><h3>Pending</h3><strong id="pendingCount">0</strong></div><div class="card"><h3>Active</h3><strong id="activeLoanCount">0</strong></div><div class="card"><h3>Salio Mikopo</h3><strong id="loanBalance">0</strong></div></div><div class="table-box"><div class="balanceLive"><div id="todayReportBal">TZS 0</div><small>Salio la Ripoti ya Leo - Hii ndio Balance uliosema huioni</small></div></div></section>

<section id="wateja" class="section"><div class="table-box"><div id="customersList"></div></div></section>
<section id="maombi" class="section"><div class="table-box"><div id="applicationsList"></div></div></section>
<section id="mikopo" class="section"><div class="table-box"><div id="activeLoansList"></div></div></section>
<section id="marejesho" class="section"><div class="form-box"><label>Mkopo</label><select id="paymentLoan"></select><label>Kiasi</label><input id="paymentAmount" type="number"><label>Tarehe</label><input id="paymentDate" type="date"><label>Njia</label><select id="paymentMethod"><option value="Cash">Cash - Mapato</option><option value="Bank">Bank - Mapato</option><option value="Fine">Fine - Faini</option></select><button id="payBtn" style="width:100%">HIFADHI + INGIZA RIPOTI</button><div id="paymentMessage"></div></div><div class="table-box"><div id="paymentsList"></div></div></section>
<section id="ratiba" class="section"><div class="table-box"><div id="schedulesList"></div></div></section>

<section id="ripoti" class="section"><h2>RIPOTI</h2><div class="form-box">
<div class="balanceLive"><div id="liveBal">TZS 0</div><small>Salio Live = Mapato - Matumizi</small></div>
<label>Tarehe</label><input id="reportDate" type="date"><label>Mapato</label><input id="rSales" type="number" value="0"><label>Fine</label><input id="rFine" type="number" value="0"><label>Mengine Mapato</label><input id="rOtherIncome" type="number" value="0"><label>MD</label><input id="rMd" type="number" value="0"><label>Store</label><input id="rStore" type="number" value="0"><label>Bank</label><input id="rBank" type="number" value="0"><label>Usafiri</label><input id="rTransport" type="number" value="0"><label>Chakula</label><input id="rFood" type="number" value="0"><label>Mawasiliano</label><input id="rCommunication" type="number" value="0"><label>Matengenezo</label><input id="rMaintenance" type="number" value="0"><label>Mengine Matumizi</label><input id="rOtherExpense" type="number" value="0"><button id="saveDailyReport" style="width:100%">HIFADHI RIPOTI</button><div id="reportMessage"></div></div>
<div class="table-box"><div id="reportsList"></div></div>
<!-- TUMA KWA BOSI - TULIVYOANZA -->
<div class="form-box" style="background:linear-gradient(135deg,#064e3b,#047857);color:#fff"><h3 style="margin:0 0 10px;text-align:center">📤 TUMA KWA BOSI (TULIVYOANZA)</h3><label style="color:#fff">Namba ya Bosi</label><input id="bossPhone" placeholder="2557XXXXXXXX" value="255"><button id="sendBossBtn" style="background:#25D366;width:100%;margin-top:10px;font-size:16px">📱 TUMA WHATSAPP KWA BOSI</button><button id="copyBossBtn" style="background:#fff;color:#065f46;width:100%;margin-top:8px">📋 COPY RIPOTI</button><div id="bossMsg" style="text-align:center;margin-top:10px;font-weight:bold"></div></div>
</section>

<section id="maafisa" class="section"><div class="table-box"><div id="maafisaList"></div></div></section>
</div>
<script>
const SUPABASE_URL="https://kvcbsebklyuupwixmagd.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_CaipCB_cvv1uPsqtt4Yalg_cFWGSP2t";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);const money=v=>"TZS "+Number(v||0).toLocaleString();const esc=v=>String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
function showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));document.querySelector(`.menu button[data-section="${id}"]`)?.classList.add("active");}
let isAdmin=false;
async function autoAddToReport(type,amount,date){const rDate=date||new Date().toISOString().slice(0,10);const {data}=await supabaseClient.from("daily_reports").select("*").eq("report_date",rDate).maybeSingle();let row=data||{report_date:rDate,sales:0,fine:0,other_income:0,total_income:0,md:0,store:0,bank:0,transport:0,food:0,communication:0,maintenance:0,other_expense:0,total_expense:0,balance:0};if(type==='payment')row.sales+=Number(amount);if(type==='fine')row.fine+=Number(amount);row.total_income=Number(row.sales||0)+Number(row.fine||0)+Number(row.other_income||0);row.total_expense=Number(row.md||0)+Number(row.store||0)+Number(row.bank||0)+Number(row.transport||0)+Number(row.food||0)+Number(row.communication||0)+Number(row.maintenance||0)+Number(row.other_expense||0);row.balance=row.total_income-row.total_expense;await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date"});}
function calcLive(){const g=id=>Number($(id)?.value||0);const inc=g("rSales")+g("rFine")+g("rOtherIncome");const exp=g("rMd")+g("rStore")+g("rBank")+g("rTransport")+g("rFood")+g("rCommunication")+g("rMaintenance")+g("rOtherExpense");const bal=inc-exp;if($("liveBal"))$("liveBal").textContent=money(bal);return {inc,exp,bal};}
document.addEventListener("input",e=>{if(e.target.id.startsWith("r"))calcLive()});
async function loadReports(){const {data}=await supabaseClient.from("daily_reports").select("*").order("report_date",{ascending:false});$("reportsList").innerHTML=!data?.length?"Hakuna ripoti":data.map((r,i)=>`<div style="padding:10px 0;border-bottom:1px solid #ddd"><b>${i+1}. ${r.report_date}</b><br>Mapato: ${money(r.total_income)} | Matumizi: ${money(r.total_expense)}<br><b style="color:#047857;font-size:16px">Salio: ${money(r.balance)}</b></div>`).join("");if($("todayReportBal")&&data?.[0])$("todayReportBal").textContent=money(data[0].balance);}
async function loadAll(){const {count:c}=await supabaseClient.from("customers").select("id",{count:"exact",head:true});$("customerCount").textContent=c||0;const {data:p}=await supabaseClient.from("loan_applications").select("id").eq("status","pending");$("pendingCount").textContent=p?.length||0;const {data:loans}=await supabaseClient.from("loans").select("id,total_amount").eq("loan_status","active");$("activeLoanCount").textContent=loans?.length||0;const {data:pays}=await supabaseClient.from("payments").select("amount,loan_id");let total=0;loans?.forEach(l=>{const paid=pays?.filter(x=>x.loan_id===l.id).reduce((a,b)=>a+Number(b.amount),0)||0;total+=Math.max(0,Number(l.total_amount||0)-paid)});$("loanBalance").textContent=money(total);loadReports();}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const {data,error}=await supabaseClient.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("message").textContent=error.message;return;}$("loginPage").style.display="none";$("app").style.display="block";$("welcomeEmail").textContent=data.user.email;const {data:off}=await supabaseClient.from("officers").select("role").eq("user_id",data.user.id).maybeSingle();isAdmin=(off?.role||"").toLowerCase()==="admin";loadAll();calcLive();});
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.reload()});
document.querySelectorAll(".menu button").forEach(b=>b.addEventListener("click",()=>{showSection(b.dataset.section);if(b.dataset.section==="ripoti"){loadReports();calcLive();}}));
$("reportDate").value=new Date().toISOString().slice(0,10);$("paymentDate").value=new Date().toISOString().slice(0,10);
$("saveDailyReport").addEventListener("click",async()=>{const live=calcLive();const row={report_date:$("reportDate").value,sales:Number($("rSales").value||0),fine:Number($("rFine").value||0),other_income:Number($("rOtherIncome").value||0),total_income:live.inc,md:Number($("rMd").value||0),store:Number($("rStore").value||0),bank:Number($("rBank").value||0),transport:Number($("rTransport").value||0),food:Number($("rFood").value||0),communication:Number($("rCommunication").value||0),maintenance:Number($("rMaintenance").value||0),other_expense:Number($("rOtherExpense").value||0),total_expense:live.exp,balance:live.bal};await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date"});$("reportMessage").textContent="✅ Imehifadhiwa Salio "+money(live.bal);loadReports();});
$("payBtn")?.addEventListener("click",async()=>{const amt=Number($("paymentAmount").value);const d=$("paymentDate").value;const m=$("paymentMethod").value;const sel=$("paymentLoan").value;if(!sel||!amt)return alert("Chagua mkopo na kiasi");await supabaseClient.from("payments").insert([{loan_id:sel,amount:amt,payment_date:d,payment_method:m}]);if(m==="Fine")await autoAddToReport("fine",amt,d);else await autoAddToReport("payment",amt,d);$("paymentMessage").textContent="✅ Imehifadhiwa + Ripoti";loadAll();});
async function sendToBoss(wa=true){const date=$("reportDate").value;const {data:rep}=await supabaseClient.from("daily_reports").select("*").eq("report_date",date).maybeSingle();if(!rep)return alert("Hakuna ripoti ya "+date);const msg=`*GHANTENDE RIPOTI - ${rep.report_date}*\n\nMAPATO:\nMauzo: ${money(rep.sales)}\nFine: ${money(rep.fine)}\nMengine: ${money(rep.other_income)}\n*Jumla Mapato: ${money(rep.total_income)}*\n\nMATUMIZI:\nMD: ${money(rep.md)}\nStore: ${money(rep.store)}\nBank: ${money(rep.bank)}\nUsafiri: ${money(rep.transport)}\nChakula: ${money(rep.food)}\nMawasiliano: ${money(rep.communication)}\nMatengenezo: ${money(rep.maintenance)}\nMengine: ${money(rep.other_expense)}\n*Jumla Matumizi: ${money(rep.total_expense)}*\n\n*SALIO LA LEO: ${money(rep.balance)}*\n\nImetumwa kutoka Ghantende V3.2`;if(wa){const phone=$("bossPhone").value.replace(/\D/g,"");window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,"_blank");$("bossMsg").textContent="✅ Inatuma kwa Bosi...";}else{navigator.clipboard.writeText(msg);$("bossMsg").textContent="✅ ImeCopy - Bandika WhatsApp";}}
$("sendBossBtn").addEventListener("click",()=>sendToBoss(true));$("copyBossBtn").addEventListener("click",()=>sendToBoss(false));
</script></body></html>
