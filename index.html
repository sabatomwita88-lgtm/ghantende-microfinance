<script>
const SUPABASE_URL="https://kvcbsebklyuupwixmagd.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_CaipCB_cvv1uPsqtt4Yalg_cFWGSP2t";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>'"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))}function money(v){return "TZS "+Number(v||0).toLocaleString()}function showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));const mb=document.querySelector('.menu button[data-section="'+id+'"]');if(mb)mb.classList.add("active")}

async function autoAddToReport(type,amount,date){
  const rDate=date||new Date().toISOString().slice(0,10);
  const {data}=await supabaseClient.from("daily_reports").select("*").eq("report_date",rDate).maybeSingle();
  let row=data||{report_date:rDate,sales:0,fine:0,other_income:0,total_income:0,md:0,store:0,bank:0,transport:0,food:0,communication:0,maintenance:0,other_expense:0,total_expense:0,balance:0};
  if(type==='payment') row.sales+=Number(amount);
  if(type==='fine') row.fine+=Number(amount);
  if(type==='other') row.other_income+=Number(amount);
  row.total_income=Number(row.sales||0)+Number(row.fine||0)+Number(row.other_income||0);
  row.total_expense=Number(row.md||0)+Number(row.store||0)+Number(row.bank||0)+Number(row.transport||0)+Number(row.food||0)+Number(row.communication||0)+Number(row.maintenance||0)+Number(row.other_expense||0);
  row.balance=row.total_income-row.total_expense;
  await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date"});
}
async function loadOfficerRole(u=null){try{let user=u;if(!user){const r=await supabaseClient.auth.getUser();user=r.data?.user}if(!user)return;const {data:officer}=await supabaseClient.from("officers").select("id,full_name,email,role,user_id").eq("user_id",user.id).maybeSingle();const {data:profile}=await supabaseClient.from("user_profiles").select("full_name,role").eq("id",user.id).maybeSingle();currentOfficer=officer;const role=String(officer?.role||profile?.role||"").toLowerCase();isAdmin=role==="admin";$("adminBadge").style.display=isAdmin?"block":"none";$("adminName").textContent=isAdmin?(officer?.full_name||profile?.full_name||user.email):"";$("usersMenu").style.display=isAdmin?"block":"none"}catch(e){isAdmin=false}}function requireAdmin(){if(!isAdmin){alert("Hii ni kazi ya ADMIN tu!");return false}return true}
let appLoading=false;async function showApp(user){if(appLoading)return;appLoading=true;$("loginPage").style.display="none";$("app").style.display="block";$("welcomeEmail").textContent=user?.email||"";try{await loadOfficerRole(user);showSection("dashboard");await loadDashboard()}finally{appLoading=false}}function showLogin(){$("loginPage").style.display="flex";$("app").style.display="none"}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("email").value.trim(),password=$("password").value,msg=$("message"),btn=$("loginButton");btn.disabled=true;btn.textContent="INAINGIA...";msg.textContent="";try{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;await showApp(data.user)}catch(err){msg.style.color="red";msg.textContent=err.message}finally{btn.disabled=false;btn.textContent="INGIA"}});
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();showLogin()});
document.querySelectorAll(".menu button").forEach(b=>{b.addEventListener("click",async()=>{showSection(b.dataset.section);if(b.dataset.section==="wateja")await loadCustomers();if(b.dataset.section==="maombi"){await loadCustomerOptions();await loadPendingApplications()}if(b.dataset.section==="mikopo")await loadActiveLoansPage("activeLoansList");if(b.dataset.section==="maafisa")await loadMaafisa();if(b.dataset.section==="watumiaji"&&isAdmin)await loadUsers();if(b.dataset.section==="marejesho"){await loadPaymentLoans();await loadPayments()}if(b.dataset.section==="ratiba")await loadSchedules();if(b.dataset.section==="ripoti")await loadReports()})});
async function loadDashboard(){await loadCustomers();await loadPendingApplications();await loadActiveLoans()}
async function loadCustomers(){const {data,error,count}=await supabaseClient.from("customers").select("id,customer_number,full_name,phone,national_id,address",{count:"exact"}).order("id",{ascending:false});if(error){$("customersList").innerHTML=esc(error.message);return}$("customerCount").textContent=count??data.length;const html=!data?.length?"Hakuna":data.map((c,i)=>{let btns=isAdmin?`<div class="actions"><button class="edit-btn" onclick="editCustomer('${c.id}')">HARIRI</button><button class="delete-btn" onclick="deleteCustomer('${c.id}')">FUTA</button></div>`:`<div style="font-size:11px;color:#888;margin-top:6px">View only - Admin tu</div>`;return `<div class="customer"><b>${i+1}. ${esc(c.full_name)}</b><br>${esc(c.customer_number)} | ${esc(c.phone)}${btns}</div>`}).join("");$("customersList").innerHTML=html;if($("customersPageList"))$("customersPageList").innerHTML=html;await loadCustomerOptions(data)}
async function loadCustomerOptions(customers){if(!customers){const r=await supabaseClient.from("customers").select("id,full_name,customer_number").order("full_name");customers=r.data||[]}$("loanCustomer").innerHTML='<option value="">--</option>'+customers.map(c=>`<option value="${c.id}">${esc(c.full_name)}</option>`).join("")}
async function loadPendingApplications(){const {data}=await supabaseClient.from("loan_applications").select("*").order("id",{ascending:false});const pending=data?.filter(a=>a.status==="pending")||[];$("pendingCount").textContent=pending.length;const html=!data?.length?"Hakuna":data.map((a,i)=>{let adminBtns=isAdmin?`<div class="actions">${a.status==="pending"?`<button onclick="approveApplication('${a.id}')">APPROVE</button>`:""}<button class="delete-btn" onclick="deleteApplication('${a.id}')">FUTA</button></div>`:"";return `<div class="application"><b>Ombi ${i+1}</b> ${esc(a.customer_id)} ${money(a.amount)} <span class="badge">${esc(a.status)}</span>${adminBtns}</div>`}).join("");$("applicationsList").innerHTML=html;if($("applicationsList2"))$("applicationsList2").innerHTML=html;}
async function approveApplication(id){if(!requireAdmin())return;const {error}=await supabaseClient.rpc("approve_loan",{p_application_id:id});if(error)alert(error.message);else{alert("Approved");loadPendingApplications();loadActiveLoans()}}async function deleteApplication(id){if(!requireAdmin())return;if(!confirm("Futa?"))return;await supabaseClient.from("loan_applications").delete().eq("id",id);loadPendingApplications()}
async function getActiveLoansWithBalances(){const {data:loans}=await supabaseClient.from("loans").select("*").eq("loan_status","active").order("id",{ascending:false});const ids=(loans||[]).map(x=>x.id);let payments=[];if(ids.length){const r=await supabaseClient.from("payments").select("loan_id,amount").in("loan_id",ids);payments=r.data||[]}return (loans||[]).map(l=>{const princ=Number(l.total_amount??l.loan_amount??0);const paid=payments.filter(p=>p.loan_id===l.id).reduce((a,p)=>a+Number(p.amount||0),0);return {...l,paid,balance:Math.max(0,princ-paid),princ}})}
async function loadActiveLoans(){const loans=await getActiveLoansWithBalances();$("activeLoanCount").textContent=loans.length;const total=loans.reduce((s,l)=>s+l.balance,0);$("loanBalance").textContent=money(total);$("balanceTotal").textContent=money(total);renderActiveLoans(loans,"activeLoansList");renderActiveLoans(loans,"activeLoansPageList")}
function renderActiveLoans(loans,target){const box=$(target);if(!box)return;box.innerHTML=!loans.length?"Hakuna":loans.map((l,i)=>{let btn=isAdmin?`<button class="delete-btn" onclick="deleteLoan('${l.id}')">FUTA</button>`:"";return `<div class="application"><b>Mkopo ${i+1}</b> ${esc(l.customer_name||l.customer_id)} Salio ${money(l.balance)}<div class="actions">${btn}</div></div>`}).join("")}

async function loadMaafisa(){const {data}=await supabaseClient.from("officers").select("*").order("created_at",{ascending:false});$("maafisaList").innerHTML=!data?.length?"Hakuna":data.map((u,i)=>{let btn=isAdmin?`<div class="actions"><button class="delete-btn" onclick="deleteOfficer('${u.id}')">FUTA AFISA</button></div>`:"";return `<div class="application"><b>${i+1}. ${esc(u.full_name)}</b><br>${esc(u.email)} ${btn}</div>`}).join("")}
async function loadUsers(){if(!isAdmin)return;const {data}=await supabaseClient.from("officers").select("*").order("created_at",{ascending:false});$("usersList").innerHTML=data.map((u,i)=>{let btn=isAdmin?`<button class="delete-btn" onclick="deleteOfficer('${u.id}')">FUTA USER</button>`:"";return `<div class="application"><b>${i+1}. ${esc(u.full_name)}</b> ${esc(u.email)}<div class="actions">${btn}</div></div>`}).join("")}

async function loadPayments(){const {data}=await supabaseClient.from("payments").select("*").order("payment_date",{ascending:false});const q=($("paymentSearch")?.value||"").toLowerCase();const rows=(data||[]).filter(p=>JSON.stringify(p).toLowerCase().includes(q));$("paymentsList").innerHTML=rows.map((p,i)=>{let btn=isAdmin?`<button class="delete-btn" onclick="deletePayment('${p.id}')">FUTA</button>`:"";return `<div class="application">${i+1}. ${money(p.amount)} ${esc(p.payment_date)}<div class="actions">${btn}</div></div>`}).join("")||"Hakuna"}
async function loadSchedules(){const box=$("schedulesList");box.innerHTML="Inapakia...";const {data:sched}=await supabaseClient.from("loan_schedules").select("*").order("due_date",{ascending:true}).limit(300);if(!sched?.length){box.innerHTML="Hakuna ratiba";return}const loanIds=[...new Set(sched.map(s=>s.loan_id))];let loanMap={};if(loanIds.length){const {data:loans}=await supabaseClient.from("loans").select("id,customer_id,customer_name").in("id",loanIds);loans?.forEach(l=>loanMap[l.id]=l)}let custMap={};const custIds=[...new Set(Object.values(loanMap).map(l=>l.customer_id).filter(Boolean))];if(custIds.length){const {data:customers}=await supabaseClient.from("customers").select("id,full_name,phone").in("id",custIds);customers?.forEach(c=>custMap[c.id]=c)}const status=$("scheduleStatus").value;let filtered=status==="all"?sched:sched.filter(s=>(s.status||"due")===status);box.innerHTML=`<table style="width:100%;font-size:13px;border-collapse:collapse"><tr><th>#</th><th>Jina</th><th>Tarehe</th><th>Kiasi</th><th>Action</th></tr>${filtered.map(r=>{const loan=loanMap[r.loan_id];const cust=loan?custMap[loan.customer_id]:null;const jina=cust?.full_name||loan?.customer_name||"Mteja";let btn=isAdmin?`<button class="delete-btn" style="padding:4px 8px" onclick="deleteSchedule('${r.id}')">FUTA</button>`:"";return `<tr><td>${esc(r.installment_no)}</td><td><b>${esc(jina)}</b></td><td>${esc(r.due_date)}</td><td>${money(r.amount_due||r.amount)}</td><td>${btn}</td></tr>`}).join("")}</table>`}
async function loadReports(){const {data}=await supabaseClient.from("daily_reports").select("*").order("report_date",{ascending:false});$("reportsList").innerHTML=!data?.length?"Hakuna":data.map((r,i)=>{let btn=isAdmin?`<button class="delete-btn" onclick="deleteReport('${r.report_date}')">FUTA</button>`:"";return `<div class="application">${i+1}. ${esc(r.report_date)} ${money(r.balance)}<div class="actions">${btn}</div></div>`}).join("")}

if($("paymentSearch"))$("paymentSearch").addEventListener("input",loadPayments);if($("scheduleStatus"))$("scheduleStatus").addEventListener("change",loadSchedules);if($("generateSchedules"))$("generateSchedules").addEventListener("click",async()=>{const {error}=await supabaseClient.rpc("generate_all_active_loan_schedules");if(error)alert(error.message);else loadSchedules()});if($("saveDailyReport"))$("saveDailyReport").addEventListener("click",async()=>{const row={report_date:$("reportDate").value,sales:Number($("rSales").value||0),fine:Number($("rFine").value||0),other_income:Number($("rOtherIncome").value||0),total_income:Number($("rSales").value||0)+Number($("rFine").value||0)+Number($("rOtherIncome").value||0),md:Number($("rMd").value||0),store:Number($("rStore").value||0),bank:Number($("rBank").value||0),transport:Number($("rTransport").value||0),food:Number($("rFood").value||0),communication:Number($("rCommunication").value||0),maintenance:Number($("rMaintenance").value||0),other_expense:Number($("rOtherExpense").value||0),total_expense:Number($("rMd").value||0)+Number($("rStore").value||0)+Number($("rBank").value||0)+Number($("rTransport").value||0)+Number($("rFood").value||0)+Number($("rCommunication").value||0)+Number($("rMaintenance").value||0)+Number($("rOtherExpense").value||0),balance:0};row.balance=row.total_income-row.total_expense;const {error}=await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date"});$("reportMessage").textContent=error?error.message:"Imehifadhiwa";if(!error)loadReports()});
document.querySelectorAll(".card[data-page]").forEach(c=>c.addEventListener("click",async()=>{showSection(c.dataset.page);if(c.dataset.page==="customersPage")await loadCustomers();if(c.dataset.page==="applicationsPage")await loadPendingApplications();if(c.dataset.page==="activeLoansPage")await loadActiveLoansPage()}));document.querySelectorAll(".homeButton").forEach(b=>b.addEventListener("click",()=>showSection("dashboard")));
$("loanForm").addEventListener("submit",async e=>{e.preventDefault();const {data:auth}=await supabaseClient.auth.getUser();const {data:officer}=await supabaseClient.from("officers").select("id").eq("user_id",auth.user.id).maybeSingle();if(!officer){$("loanMessage").textContent="Officer not found";return}await supabaseClient.from("loan_applications").insert([{customer_id:$("loanCustomer").value,officer_id:officer.id,amount:Number($("loanAmount").value),purpose:$("loanPurpose").value,application_date:new Date().toISOString().slice(0,10),status:"pending"}]);$("loanMessage").textContent="Imetumwa";$("loanForm").reset();loadPendingApplications()});
$("paymentForm").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!requireAdmin())return;
  const amt=Number($("paymentAmount").value);
  const pdate=$("paymentDate").value;
  const {error}=await supabaseClient.from("payments").insert([{loan_id:$("paymentLoan").value,amount:amt,payment_date:pdate,payment_method:$("paymentMethod").value}]);
  if(error){$("paymentMessage").textContent=error.message;return}
  // === INAPELEKA AUTOMATIC KWENYE RIPOTI ===
  await autoAddToReport('payment', amt, pdate);
  $("paymentMessage").textContent="✅ Imehifadhiwa + Imeingia kwenye Ripoti ya "+pdate+" moja kwa moja!";
  loadPayments();loadActiveLoans();loadReports();
});
</script></body></html>
