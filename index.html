<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHANTENDE MICROFINANCE V3.2 FINAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#064e3b,#0f766e);color:#222}
button{border:0;border-radius:9px;padding:12px 16px;background:#047857;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
input,select,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;font-size:16px;margin:6px 0 14px}
label{display:block;font-weight:bold;margin-top:8px}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:100%;max-width:410px;background:#fff;border-radius:18px;padding:30px 24px}
#app{display:none;min-height:100vh;background:#f3f4f6}
header{background:#065f46;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}
.menu{background:#fff;display:flex;gap:8px;padding:10px;overflow-x:auto;border-bottom:1px solid #ddd}
.menu button{background:#e5e7eb;color:#222;white-space:nowrap;padding:10px 14px}
.menu button.active{background:#047857;color:#fff}
.section{display:none;padding:18px;max-width:1100px;margin:auto}
.section.active{display:block}
.card{background:#fff;padding:19px;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);cursor:pointer}
.form-box,.table-box{background:#fff;padding:18px;border-radius:14px;box-shadow:0 3px 12px rgba(0,0,0,.08);margin-top:12px}
.customer,.application{padding:14px 0;border-bottom:1px solid #ddd}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#ecfdf5;color:#065f46;font-size:12px;font-weight:bold}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.edit-btn{background:#2563eb}.delete-btn{background:#dc2626}.block-btn{background:#ff9800}.unblock-btn{background:#16a34a}.pwd-btn{background:#7c3aed}
.balance-box{background:linear-gradient(90deg,#16a34a,#2563eb);color:white;padding:20px;border-radius:16px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div id="loginPage"><div class="login-box"><h1 style="text-align:center;color:#065f46">GHANTENDE V3.2 FINAL</h1><p style="text-align:center">ADMIN FULL - Password Tu</p><form id="loginForm"><label>Gmail</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button id="loginButton" type="submit" style="width:100%">INGIA</button><div id="message" style="text-align:center;margin-top:10px;font-weight:bold"></div></form></div></div>
<div id="app">
<header><h2>GHANTENDE</h2><div><button onclick="changeMyPassword()" style="background:#fff;color:#065f46;padding:9px 13px">🔑 Password</button> <button id="logoutButton" style="background:#dc2626;padding:9px 13px">TOKA</button></div></header>
<div class="menu">
<button class="active" data-section="dashboard">Dashboard</button>
<button data-section="wateja">Wateja</button>
<button data-section="maombi">Maombi</button>
<button data-section="mikopo">Mikopo</button>
<button data-section="marejesho">Marejesho</button>
<button data-section="ratiba">Ratiba</button>
<button data-section="ripoti">Ripoti</button>
<button data-section="maafisa">Maafisa</button>
<button id="usersMenu" data-section="watumiaji" style="display:none">👑 Watumiaji</button>
</div>
<section id="dashboard" class="section active"><div id="welcomeEmail"></div><div id="adminBadge" style="display:none;background:#ecfdf5;padding:10px;border-radius:8px;margin:10px 0">🔐 ADMIN: <span id="adminName"></span></div><div class="card"><h3>Wateja</h3><strong id="customerCount">0</strong></div></section>
<section id="wateja" class="section"><button id="addCustomerButton">+ MTEJA</button><div id="customersList"></div></section>
<section id="maombi" class="section"><select id="loanCustomer"></select><input id="loanAmount" type="number" placeholder="Kiasi"><textarea id="loanPurpose" placeholder="Sababu"></textarea><button id="submitLoanButton">TUMA OMBI</button><div id="applicationsList"></div></section>
<section id="mikopo" class="section"><div id="activeLoansList"></div></section>
<section id="ripoti" class="section">
<h2>📊 RIPOTI</h2><input id="reportDate" type="date">
<label>Lala jana</label><input id="rOpening" type="number" value="0">
<label>Mauzo</label><input id="rSales" type="number" value="0">
<label>Fomu</label><input id="rFine" type="number" value="0">
<label>Mapato mengine</label><input id="rOtherIncome" type="number" value="0">
<p>Jumla Mapato: <span id="totalIncome">0</span></p>
<label>MD</label><input id="rMd" type="number" value="0">
<label>Store</label><input id="rStore" type="number" value="0">
<label>Bank</label><input id="rBank" type="number" value="0">
<label>Usafiri</label><input id="rTransport" type="number" value="0">
<label>Chakula</label><input id="rFood" type="number" value="0">
<label>Mawasiliano</label><input id="rCommunication" type="number" value="0">
<label>Matengenezo</label><input id="rMaintenance" type="number" value="0">
<label>Mengine</label><input id="rOtherExpense" type="number" value="0">
<p>Jumla Matumizi: <span id="totalExpense">0</span></p>
<div class="balance-box"><div id="dailyBalance" style="font-size:32px">TZS 0</div></div>
<button id="saveDailyReport" style="width:100%;margin-top:10px">HIFADHI RIPOTI</button>
<button onclick="tumaRipotiSMS()" style="width:100%;margin-top:8px;background:#0f766e">📲 TUMA SMS</button>
<div id="reportsList"></div>
</section>
<section id="watumiaji" class="section">
<h2>👑 ADMIN FULL - Watumiaji (Password Tu)</h2>
<div class="form-box">
<h3>➕ Ongeza User</h3>
<form id="userForm"><input id="newUserName" placeholder="Jina" required><input id="newUserPhone" placeholder="Simu"><input id="newUserEmail" type="email" placeholder="Gmail" required><input id="newUserPassword" type="password" placeholder="Password min 6" required><select id="newUserRole"><option value="officer">Officer</option><option value="cashier">Cashier</option><option value="admin">Admin</option></select><button type="submit">ONGEZA USER</button><div id="userMessage"></div></form>
</div>
<div class="form-box" style="background:#fff7ed">
<h3>🔑 Badili Password ya User</h3>
<select id="editUserSelect"><option value="">-- Chagua User --</option></select><input id="adminNewPassword" placeholder="Password mpya min 6"><button onclick="adminChangePassword()" style="background:#7c3aed;width:100%">💾 BADILI PASSWORD</button><button onclick="adminSendReset()" style="background:#333;width:100%;margin-top:6px">📧 TUMA EMAIL RESET</button><div id="adminPassMessage"></div>
</div>
<div class="table-box"><div id="usersList">Inapakia...</div></div>
</section>
<section id="maafisa" class="section"><div id="maafisaList"></div></section>
</div>
<script>
const SUPABASE_URL="https://kvcbsebklyuupwixmagd.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_CaipCB_cvv1uPsqtt4Yalg_cFWGSP2t";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
function money(v){return "TZS "+Number(v||0).toLocaleString()}
function showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));const mb=document.querySelector('.menu button[data-section="'+id+'"]');if(mb)mb.classList.add("active")}
let isAdmin=false;
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("email").value.trim(),password=$("password").value;try{const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error)throw error;const {data:off}=await supabaseClient.from("officers").select("is_blocked").eq("user_id",data.user.id).maybeSingle();if(off&&off.is_blocked){await supabaseClient.auth.signOut();throw new Error("⛔ Account yako BLOCKED na Admin")} $("loginPage").style.display="none";$("app").style.display="block";await loadOfficerRole(data.user);showSection("dashboard")}catch(err){$("message").textContent=err.message}});
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.reload()});
document.querySelectorAll(".menu button").forEach(b=>b.addEventListener("click",()=>showSection(b.dataset.section)));
async function loadOfficerRole(u){const {data}=await supabaseClient.from("officers").select("role,full_name").eq("user_id",u.id).maybeSingle();isAdmin=(data?.role==="admin");$("usersMenu").style.display=isAdmin?"block":"none";$("adminBadge").style.display=isAdmin?"block":"none";$("adminName").textContent=data?.full_name||"";if(isAdmin)loadUsers()}
async function loadUsers(){const {data}=await supabaseClient.from("officers").select("*").order("created_at",{ascending:false});$("editUserSelect").innerHTML='<option value="">-- Chagua User --</option>'+data.map(u=>`<option value="${u.email}">${u.full_name} - ${u.email} ${u.is_blocked?'[BLOCKED]':''}</option>`).join("");$("usersList").innerHTML=data.map(u=>`<div style="border-bottom:1px solid #ddd;padding:10px"><b>${u.full_name}</b> ${u.is_blocked?'<span style="color:red">⛔ BLOCKED</span>':'<span style="color:green">✅ ACTIVE</span>'}<br>${u.email} | ${u.role}<br><button class="${u.is_blocked?'unblock-btn':'block-btn'}" onclick="toggleBlock('${u.id}',${u.is_blocked})">${u.is_blocked?'UNBLOCK':'BLOCK'}</button> <button class="delete-btn" onclick="deleteUser('${u.id}')">FUTA</button> <button class="pwd-btn" onclick="document.getElementById('editUserSelect').value='${u.email}'">Badili PWD</button></div>`).join("")}
async function toggleBlock(id,blocked){if(!confirm((blocked?'UNBLOCK':'BLOCK')+" user huyu?"))return;await supabaseClient.from("officers").update({is_blocked:!blocked}).eq("id",id);loadUsers()}
async function deleteUser(id){if(!confirm("Futa user huyu?"))return;await supabaseClient.from("officers").delete().eq("id",id);loadUsers()}
async function adminChangePassword(){const email=$("editUserSelect").value,pass=$("adminNewPassword").value.trim();if(!email||pass.length<6)return alert("Chagua user na password min 6");const {error}=await supabaseClient.auth.resetPasswordForEmail(email);if(error)return alert(error.message);alert("✅ Email ya reset imetumwa kwa "+email+"\nMwambie aandike password mpya: "+pass)}
async function adminSendReset(){const email=$("editUserSelect").value;if(!email)return alert("Chagua user");await supabaseClient.auth.resetPasswordForEmail(email);alert("Email imetumwa kwa "+email)}
async function changeMyPassword(){const p=prompt("Password mpya (min 6):");if(!p||p.length<6)return alert("Fupi");const {error}=await supabaseClient.auth.updateUser({password:p});alert(error?error.message:"✅ Password imebadilika!")}
function tumaRipotiSMS(){alert("SMS: "+$("dailyBalance").textContent)}
document.querySelectorAll("#ripoti input").forEach(i=>i.addEventListener("input",()=>{const g=id=>Number($(id).value||0);const inc=g("rSales")+g("rFine")+g("rOtherIncome");const exp=g("rMd")+g("rStore")+g("rBank")+g("rTransport")+g("rFood")+g("rCommunication")+g("rMaintenance")+g("rOtherExpense");const bal=g("rOpening")+inc-exp;$("totalIncome").textContent=money(inc);$("totalExpense").textContent=money(exp);$("dailyBalance").textContent=money(bal)}));
$("userForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("newUserEmail").value.trim(),password=$("newUserPassword").value.trim(),full_name=$("newUserName").value.trim(),phone=$("newUserPhone").value.trim(),role=$("newUserRole").value;const {data,error}=await supabaseClient.auth.signUp({email,password});if(error)return alert(error.message);await supabaseClient.from("officers").insert([{user_id:data.user.id,full_name,email,phone,role,is_blocked:false}]);alert("✅ Ameongezwa");loadUsers()});
</script>
</body>
</html>
