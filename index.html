<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GHANTENDE V1 CLASSIC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;font-family:system-ui,Arial}body{margin:0;background:#f0fdf4}
#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#065f46,#047857);padding:15px}
.login-card{background:#fff;width:100%;max-width:380px;border-radius:20px;padding:25px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.login-card h1{text-align:center;color:#065f46;margin:0} .login-card p{text-align:center;color:#666;font-size:12px}
input{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;margin:8px 0}button{width:100%;padding:13px;background:#065f46;color:#fff;border:0;border-radius:10px;font-weight:bold;cursor:pointer}
#app{display:none}header{background:#065f46;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.menu{background:#fff;display:flex;gap:8px;padding:10px;overflow-x:auto;border-bottom:1px solid #e5e7eb}
.menu button{background:#e5e7eb;color:#333;padding:8px 14px;width:auto;white-space:nowrap}.menu button.active{background:#065f46;color:#fff}
.section{display:none;padding:12px;max-width:900px;margin:auto}.section.active{display:block}
.card{background:#fff;padding:15px;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.balance{background:linear-gradient(90deg,#059669,#2563eb);color:#fff;text-align:center;border-radius:14px;padding:18px}
.balance div{font-size:28px;font-weight:bold}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;background:#f3f4f6;padding:8px}td{padding:8px;border-bottom:1px solid #f0f0f0}
</style>
</head>
<body>
<div id="loginPage"><div class="login-card"><h1>GHANTENDE</h1><p>Mfumo wa Mikopo - V1 Tulioanza Nao</p><input id="email" type="email" placeholder="Email yako"><input id="password" type="password" placeholder="Password"><button id="loginBtn">INGIA KWENYE MFUMO</button><div id="msg" style="text-align:center;margin-top:10px;font-size:13px;color:red"></div></div></div>
<div id="app">
<header><b>GHANTENDE</b><div><button id="logoutBtn" style="width:auto;background:#dc2626;padding:6px 12px">Toka</button></div></header>
<div class="menu">
<button data-s="dashboard" class="active">Dashboard</button><button data-s="wateja">Wateja</button><button data-s="mikopo">Mikopo</button><button data-s="ratiba">Ratiba</button><button data-s="marejesho">Marejesho</button><button data-s="ripoti">Ripoti</button>
</div>
<section id="dashboard" class="section active"><div class="card">Karibu: <b id="uEmail"></b><div id="dashInfo" style="margin-top:10px"></div></div><div class="card balance"><div id="todayBal">TZS 0</div><small>Salio la Leo</small></div></section>
<section id="wateja" class="section"><div class="card"><h3>Ongeza Mteja</h3><input id="cName" placeholder="Jina Kamili"><input id="cPhone" placeholder="Simu"><input id="cAddress" placeholder="Mahali"><button id="addCustomerBtn">HIFADHI MTEJA</button></div><div class="card" id="watejaList"></div></section>
<section id="mikopo" class="section"><div class="card" id="mikopoList"></div></section>
<section id="ratiba" class="section">
<div class="card" style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">Ratiba ya Malipo (Majina)</h3><button id="genBtn" style="width:auto">Tengeneza</button></div>
<div class="card"><input id="sSearch" placeholder="Tafuta jina..."></div>
<div class="card" id="ratibaList">Inapakia...</div>
</section>
<section id="marejesho" class="section"><div class="card"><h3>Lipa</h3><select id="loanSelect" style="width:100%;padding:12px;border-radius:8px"></select><input id="payAmount" type="number" placeholder="Kiasi"><button id="payBtn">LIPA</button></div><div class="card" id="malipoList"></div></section>
<section id="ripoti" class="section">
<div class="card"><input id="rDate" type="date"><input id="rOpening" type="number" placeholder="Lala Jana"><input id="rSales" type="number" placeholder="Mauzo ya Leo"><input id="rMd" type="number" placeholder="MD"><input id="rStore" type="number" placeholder="Store"><input id="rBank" type="number" placeholder="Bank"><div class="balance" style="margin-top:10px"><div id="rBal">TZS 0</div></div><button id="saveReport" style="margin-top:10px">HIFADHI RIPOTI</button></div>
</section>
</div>
<script>
const SUPA_URL="https://kvcbsebklyuupwixmagd.supabase.co";const SUPA_KEY="sb_publishable_CaipCB_cvv1uPsqtt4Yalg_cFWGSP2t";
const supabase=window.supabase.createClient(SUPA_URL,SUPA_KEY);
const $=id=>document.getElementById(id);const money=n=>"TZS "+Number(n||0).toLocaleString();
let customers=[],loans=[];
function show(s){document.querySelectorAll(".section").forEach(e=>e.classList.remove("active"));$(s).classList.add("active");document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));document.querySelector(`.menu button[data-s="${s}"]`)?.classList.add("active");if(s==="ratiba")loadRatiba();if(s==="wateja")loadWateja();if(s==="mikopo")loadMikopo()}
document.querySelectorAll(".menu button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.s)));
$("loginBtn").addEventListener("click",async()=>{
 const email=$("email").value.trim(),password=$("password").value; $("msg").textContent="Inaingia...";
 const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){$("msg").textContent=error.message;return}
 const {data:off}=await supabase.from("officers").select("is_blocked").eq("user_id",data.user.id).maybeSingle();
 if(off&&off.is_blocked){await supabase.auth.signOut();$("msg").textContent="⛔ Akaunti imezuiwa";return}
 $("loginPage").style.display="none";$("app").style.display="block";$("uEmail").textContent=data.user.email;
 await loadWateja();await loadMikopo();await loadRatiba();
});
$("logoutBtn").addEventListener("click",async()=>{await supabase.auth.signOut();location.reload()});
async function loadWateja(){const {data}=await supabase.from("customers").select("*").order("created_at",{ascending:false});customers=data||[];$("watejaList").innerHTML=customers.map((c,i)=>`${i+1}. <b>${c.full_name}</b> - ${c.phone} <small>${c.address||''}</small>`).join("<br>")||"Hakuna wateja";$("dashInfo").innerHTML=`Wateja: <b>${customers.length}</b>`}
$("addCustomerBtn").addEventListener("click",async()=>{const full_name=$("cName").value,phone=$("cPhone").value,address=$("cAddress").value;if(!full_name||!phone)return alert("Jaza jina na simu");await supabase.from("customers").insert({full_name,phone,address});$("cName").value="";$("cPhone").value="";await loadWateja()});
async function loadMikopo(){const {data}=await supabase.from("loans").select("*").eq("loan_status","active").order("created_at",{ascending:false});loans=data||[];$("mikopoList").innerHTML=loans.map(l=>{const c=customers.find(x=>x.id===l.customer_id);return `<div>${c?c.full_name:l.customer_id} - ${money(l.total_amount||l.amount)} - ${l.loan_status}</div>`}).join("")||"Hakuna mikopo hai";$("loanSelect").innerHTML=loans.map(l=>{const c=customers.find(x=>x.id===l.customer_id);return `<option value="${l.id}">${c?c.full_name:l.customer_id}</option>`}).join("")}
async function loadRatiba(){
 $("ratibaList").innerHTML="Inapakia...";
 const {data:sched}=await supabase.from("loan_schedules").select("*").order("due_date",{ascending:true}).limit(200);
 if(!sched||!sched.length){$("ratibaList").innerHTML="Hakuna ratiba. Bonyeza Tengeneza.";return}
 const loanIds=[...new Set(sched.map(s=>s.loan_id))];let loansMap={},custMap={};
 if(loanIds.length){const {data:ls}=await supabase.from("loans").select("id,customer_id").in("id",loanIds);ls?.forEach(l=>loansMap[l.id]=l);const cIds=[...new Set(ls?.map(l=>l.customer_id)||[])];if(cIds.length){const {data:cs}=await supabase.from("customers").select("id,full_name,phone").in("id",cIds);cs?.forEach(c=>custMap[c.id]=c)}}
 const q=($("sSearch").value||"").toLowerCase();
 let f=sched.filter(s=>{if(!q)return true;const lm=loansMap[s.loan_id];const cm=lm?custMap[lm.customer_id]:null;return (cm?.full_name||"").toLowerCase().includes(q)});
 $("ratibaList").innerHTML=`<table><tr><th>#</th><th>Jina</th><th>Tarehe</th><th>Kiasi</th></tr>${f.map(r=>{const lm=loansMap[r.loan_id];const cm=lm?custMap[lm.customer_id]:null;return `<tr><td>${r.installment_no}</td><td><b>${cm?cm.full_name:'...'}</b><br><small>${cm?cm.phone:''}</small></td><td>${r.due_date}</td><td>${money(r.amount_due||r.amount)}</td></tr>`}).join("")}</table>`;
}
$("sSearch").addEventListener("input",loadRatiba);
$("genBtn").addEventListener("click",async()=>{const b=$("genBtn");b.textContent="...";b.disabled=true;try{await supabase.rpc("generate_all_active_loan_schedules");await loadRatiba()}catch(e){alert(e.message)}finally{b.textContent="Tengeneza";b.disabled=false}});
function calcR(){const g=id=>Number($(id).value||0);const inc=g("rSales");const exp=g("rMd")+g("rStore")+g("rBank");const bal=g("rOpening")+inc-exp;$("rBal").textContent=money(bal);$("todayBal").textContent=money(bal)}
document.querySelectorAll("#ripoti input").forEach(i=>i.addEventListener("input",calcR));
$("saveReport").addEventListener("click",async()=>{const report_date=$("rDate").value||new Date().toISOString().slice(0,10);const opening_balance=Number($("rOpening").value||0);const sales=Number($("rSales").value||0);await supabase.from("daily_reports").insert({report_date,opening_balance,sales});alert("Imehifadhiwa")});
(function(){if($("rDate"))$("rDate").value=new Date().toISOString().slice(0,10)})();
</script>
</body>
</html>
