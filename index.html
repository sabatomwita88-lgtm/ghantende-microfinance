<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GHANTENDE V7 FINAL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:sans-serif;background:#f3f4f6}#loginPage{display:flex;justify-content:center;align-items:center;height:100vh;background:#111827}#loginPage form{background:#fff;padding:20px;border-radius:10px;width:92%;max-width:380px}input,select{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:6px}button{padding:10px;border:0;border-radius:6px;background:#111827;color:#fff;cursor:pointer;width:100%;margin-top:5px}.menu{display:flex;gap:5px;overflow:auto;padding:8px;background:#fff;position:sticky;top:0;z-index:10}.menu button{width:auto;white-space:nowrap;background:#e5e7eb;color:#111}.menu button.active{background:#111827;color:#fff}.section{display:none;padding:12px}.section.active{display:block}.customer,.application{background:#fff;padding:10px;border-radius:8px;margin-bottom:8px}.badge{padding:2px 6px;border-radius:10px;color:#fff;font-size:10px;background:#6b7280}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{background:#fff;padding:12px;border-radius:8px;text-align:center}</style></head><body>
<div id="loginPage"><form id="loginForm"><h2 style="text-align:center">GHANTENDE V7</h2><p style="text-align:center">Kiriba & Bwai - Final System</p><input id="email" type="email" required placeholder="Email"><input id="password" type="password" required placeholder="Password"><button>INGIA</button><p id="message" style="color:red;text-align:center"></p></form></div>
<div id="app" style="display:none"><div style="background:#111827;color:#fff;padding:10px;display:flex;justify-content:space-between"><span id="welcomeEmail"></span><span id="todayDate"></span><button id="logoutButton" style="width:auto;background:#dc2626">TOKA</button></div>
<div class="menu"><button data-section="dashboard" class="active">Dashboard</button><button data-section="customers">Wateja</button><button data-section="maombi">Maombi</button><button data-section="mikopo">Mikopo</button><button data-section="malipo">Malipo</button><button data-section="ripoti">Ripoti</button><button data-section="maafisa">Maafisa</button></div>
<div id="dashboard" class="section active"><div class="grid"><div class="card"><b id="customerCount">0</b><br>Wateja</div><div class="card"><b id="activeLoanCount">0</b><br>Active</div><div class="card"><b id="loanBalance">0</b><br>Salio</div><div class="card"><b id="overdueCount">0</b><br>Overdue</div><div class="card"><b id="pendingCount">0</b><br>Pending</div><div class="card"><b id="todayReportBal">0</b><br>Leo</div></div><select id="filterBranch" style="margin-top:10px"><option value="">Vituo Vyote</option><option>Kiriba Branch</option><option>Bwai Branch</option></select><button id="exportAllBtn" style="background:#059669;margin-top:10px">Pakua Excel</button></div>
<div id="customers" class="section"><h3>Sajili Mteja (Part 2)</h3><input id="cName" placeholder="Jina"><input id="cPhone" placeholder="Phone"><input id="cNumber" placeholder="Namba"><input id="cGuarantorName" placeholder="Mdhamini"><input id="cGuarantorPhone" placeholder="Phone Mdhamini"><select id="cBranch"><option value="">--Chagua Kituo--</option><option>Kiriba Branch</option><option>Bwai Branch</option></select><button id="addCustomerBtn" style="background:#2563eb">HIFADHI + SERVED BY</button><input id="searchCustomer" placeholder="Tafuta..."><div id="customersList"></div></div>
<div id="maombi" class="section"><select id="appCustomer"></select><input id="appAmount" type="number" placeholder="Kiasi"><input id="appMonths" type="number" value="1"><input id="appInterest" type="number" value="10"><div id="totalPreview" style="background:#fff;padding:8px"></div><button id="addAppBtn">TUMA OMBI</button><input id="searchApp" placeholder="Tafuta ombi"><div id="applicationsList"></div></div>
<div id="mikopo" class="section"><input id="searchLoan" placeholder="Tafuta mkopo"><div id="activeLoansList"></div><div id="singleHistory" style="display:none;background:#fff;padding:10px;border-radius:8px"></div></div>
<div id="malipo" class="section"><select id="paymentLoan"></select><input id="paymentAmount" type="number" placeholder="Kiasi"><input id="paymentFine" type="number" value="0" placeholder="Fine"><input id="paymentDate" type="date"><select id="paymentMethod"><option>M-Pesa</option><option>Cash</option><option>Bank</option></select><button id="payBtn" style="background:#059669">HIFADHI + AUTO RIPOTI</button><div id="paymentsList"></div><div id="receiptArea" style="display:none"></div></div>
<div id="ripoti" class="section"><h3>Ripoti - Auto + Mikopo Kiv yake</h3><input id="reportDate" type="date"><div class="grid"><input id="rSales" type="number" placeholder="Mauzo (auto)"><input id="rFine" type="number" placeholder="Faini (auto)"><input id="rOtherIncome" type="number" placeholder="Mapato mengine"><input id="rMd" type="number" placeholder="MD"><input id="rStore" type="number" placeholder="Store"><input id="rBank" type="number" placeholder="Bank"><input id="rTransport" type="number" placeholder="Transport"><input id="rFood" type="number" placeholder="Chakula"><input id="rCommunication" type="number" placeholder="Mawasiliano"><input id="rMaintenance" type="number" placeholder="Matengenezo"><input id="rOtherExpense" type="number" placeholder="Mengine"><input id="rMikopo" type="number" placeholder="MIKOPO ILIYOTOLEWA (auto)" style="background:#fef2f2"></div><div style="background:#fff;padding:10px;text-align:center">Salio Live: <b id="liveBal">0</b></div><button id="saveDailyReport" style="background:#111827">HIFADHI RIPOTI</button><p id="reportMsg"></p><div id="dailyDetails" style="display:none;background:#fff;padding:12px;border-radius:8px;border:2px solid #059669;margin-top:10px"></div><div id="reportsList"></div></div>
<div id="maafisa" class="section"><input id="oName" placeholder="Jina"><input id="oEmail" placeholder="Email"><input id="oPhone" placeholder="Phone"><input id="oPass" placeholder="Password"><select id="oRole"><option value="officer">officer</option><option value="admin">admin</option></select><select id="oBranch"><option value="">--Chagua Kituo--</option><option>Kiriba Branch</option><option>Bwai Branch</option></select><button id="addOfficerBtn">ONGEZA AFISA</button><p id="officerMsg"></p><div id="maafisaList"></div></div>
</div>
<script>
const SUPABASE_URL="https://kvcbsebklyuupwixmagd.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_CaipCB_cvv1uPsqtt4Yalg_cFWGSP2t";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);const money=v=>"TZS "+Number(v||0).toLocaleString();const esc=v=>String(v??"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
let allCustomers=[],allLoans=[],allPayments=[];let currentUser={email:'',name:'',branch:'',role:''};
function showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");document.querySelectorAll(".menu button").forEach(b=>b.classList.remove("active"));document.querySelector(`.menu button[data-section="${id}"]`)?.classList.add("active");}
function calcLive(){const g=id=>Number($(id)?.value||0);const inc=g("rSales")+g("rFine")+g("rOtherIncome");const exp=g("rMd")+g("rStore")+g("rBank")+g("rTransport")+g("rFood")+g("rCommunication")+g("rMaintenance")+g("rOtherExpense")+g("rMikopo");if($("liveBal"))$("liveBal").textContent=money(inc-exp);return{inc,exp,bal:inc-exp};}
async function autoAddToReport(field,amount){const today=new Date().toISOString().slice(0,10);const officer=currentUser;const {data:existing}=await supabaseClient.from("daily_reports").select("*").eq("report_date",today).eq("branch_name",officer.branch).maybeSingle();let row=existing||{report_date:today,branch_name:officer.branch,reported_by_email:officer.email,reported_by_name:officer.name,sales:0,fine:0,other_income:0,md:0,store:0,bank:0,transport:0,food:0,communication:0,maintenance:0,other_expense:0,mikopo_iliyotolewa:0};row[field]=Number(row[field]||0)+Number(amount);row.total_income=Number(row.sales||0)+Number(row.fine||0)+Number(row.other_income||0);row.total_expense=Number(row.md||0)+Number(row.store||0)+Number(row.bank||0)+Number(row.transport||0)+Number(row.food||0)+Number(row.communication||0)+Number(row.maintenance||0)+Number(row.other_expense||0)+Number(row.mikopo_iliyotolewa||0);row.balance=row.total_income-row.total_expense;await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date,branch_name"});loadReports();}
async function loadCustomers(){const {data}=await supabaseClient.from("customers").select("*").order("created_at",{ascending:false});allCustomers=data||[];const q=($("searchCustomer")?.value||"").toLowerCase();const b=$("filterBranch")?.value||"";let f=allCustomers.filter(c=>(c.full_name||"").toLowerCase().includes(q));if(b)f=f.filter(c=>c.branch_name===b);if(currentUser.role!=='admin'&&currentUser.branch)f=f.filter(c=>c.branch_name===currentUser.branch);$("customerCount").textContent=allCustomers.length;$("customersList").innerHTML=f.map((c,i)=>`<div class='customer'><b>${i+1}. ${esc(c.full_name)}</b> <span class='badge'>${esc(c.branch_name||'')}</span><br>${esc(c.phone||'')}<br><small style='color:#059669'>Served by: ${esc(c.served_by_name||'--')}</small></div>`).join("");$("appCustomer").innerHTML='<option>--Chagua--</option>'+allCustomers.map(c=>`<option value='${c.id}'>${esc(c.full_name)} [${esc(c.branch_name||'')}]</option>`).join("");}
async function loadApplications(){const {data}=await supabaseClient.from("loan_applications").select("*").order("created_at",{ascending:false});const q=($("searchApp")?.value||"").toLowerCase();const filtered=(data||[]).filter(a=>JSON.stringify(a).toLowerCase().includes(q));$("pendingCount").textContent=(data||[]).filter(a=>a.status==='pending').length;$("applicationsList").innerHTML=filtered.map((a,i)=>{const total=Number(a.total_amount||0);const col=a.status==='approved'?'#059669':a.status==='rejected'?'#dc2626':'#d97706';const isP=a.status==='pending';return `<div class='application' style='border-left:4px solid ${col}'><b>Ombi ${i+1}</b> - ${money(total)} <span class='badge' style='background:${col}'>${esc(a.status)}</span>${isP?`<div style='display:flex;gap:6px'><button onclick="approveApplication('${a.id}')" style='background:#059669;flex:1'>APPROVE</button><button onclick="rejectApplication('${a.id}')" style='background:#dc2626;flex:1'>REJECT</button></div>`:''}</div>`}).join("");}
async function loadActiveLoans(){const {data:loans}=await supabaseClient.from("loans").select("*").eq("loan_status","active").order("created_at",{ascending:false});const {data:payments}=await supabaseClient.from("payments").select("*");const {data:customers}=await supabaseClient.from("customers").select("id,phone,full_name,branch_name");allLoans=loans||[];allPayments=payments||[];const custMap={};(customers||[]).forEach(c=>custMap[c.id]=c);let bal=0,html="";const q=($("searchLoan")?.value||"").toLowerCase();const b=$("filterBranch")?.value||"";let filtered=allLoans.filter(l=>(l.customer_name||"").toLowerCase().includes(q));if(b)filtered=filtered.filter(l=>custMap[l.customer_id]?.branch_name===b);if(currentUser.role!=='admin'&&currentUser.branch)filtered=filtered.filter(l=>custMap[l.customer_id]?.branch_name===currentUser.branch);filtered.forEach((l,i)=>{let paid=0;allPayments.forEach(p=>{if(p.loan_id===l.id)paid+=Number(p.amount||0)});let rem=Number(l.total_amount||0)-paid;if(rem<0)rem=0;bal+=rem;html+=`<div class='application'><b>${i+1}. ${esc(l.customer_name)}</b> <span class='badge'>${esc(custMap[l.customer_id]?.branch_name||'')}</span><br>Salio:<b style='color:red'>${money(rem)}</b><br><small>Imeidhinishwa na: ${esc(l.approved_by_name||'--')}</small></div>`});$("loanBalance").textContent=money(bal);$("activeLoanCount").textContent=allLoans.length;$("activeLoansList").innerHTML=html||"Hakuna";$("paymentLoan").innerHTML='<option>--Chagua--</option>'+allLoans.map(l=>{let p=0;allPayments.forEach(x=>{if(x.loan_id===l.id)p+=Number(x.amount||0)});return `<option value='${l.id}'>${esc(l.customer_name)} - ${money(Number(l.total_amount||0)-p)}</option>`}).join("");$("paymentsList").innerHTML=(allPayments.slice(0,20)||[]).map(p=>`<div class='customer'>${money(p.amount)} - ${p.payment_date}</div>`).join("");}
async function loadReports(){const {data}=await supabaseClient.from("daily_reports").select("*").order("report_date",{ascending:false}).limit(30);if(!data?.length){$("reportsList").innerHTML="Hakuna";return;}$("todayReportBal").textContent=money(data[0].balance);$("reportsList").innerHTML=data.map(r=>`<div class='application' onclick="showDailyDetails('${r.report_date}','${esc(r.branch_name||'')}')" style='cursor:pointer'><b>${r.report_date}</b> <span class='badge' style='background:#059669'>${esc(r.branch_name||'')}</span> <small>Bofya kuona marejesho</small><br>Mapato:${money(r.total_income)} Matumizi:${money(r.total_expense)} <br>Mikopo Iliyotolewa:<b style='color:#dc2626'>${money(r.mikopo_iliyotolewa||0)}</b><br><b>Salio:${money(r.balance)}</b> - ${esc(r.reported_by_name||'')}</div>`).join("");}
window.showDailyDetails=async function(date,branch){const el=$("dailyDetails");el.style.display="block";el.innerHTML=`Inapakia ${date} ${branch}...`;const {data:payments}=await supabaseClient.from("payments").select("*").eq("payment_date",date).order("created_at",{ascending:false});let total=0;let html=`<div style='display:flex;justify-content:space-between'><h3>Marejesho ${date} - ${branch}</h3><button onclick="this.parentElement.parentElement.style.display='none'" style='width:auto;background:#e5e7eb;color:#222'>X</button></div>`;if(!payments?.length)html+=`<p>Hakuna marejesho siku hii</p>`;else{html+=payments.map((p,i)=>{total+=Number(p.amount||0)+Number(p.fine_amount||0);return `<div style='padding:6px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between'><span>${i+1}. ${p.payment_method} - ${new Date(p.created_at).toLocaleTimeString()}</span><b>${money(p.amount)}${p.fine_amount?` +${money(p.fine_amount)}`:''}</b></div>`}).join("");html+=`<div style='background:#111827;color:#fff;padding:10px;border-radius:6px;margin-top:10px;text-align:center'>JUMLA YA SIKU: <b>${money(total)}</b> - Marejesho ${payments.length}</div>`;}el.innerHTML=html;el.scrollIntoView();}
window.approveApplication=async function(id){const {data:appData}=await supabaseClient.from("loan_applications").select("*").eq("id",id).maybeSingle();if(!appData)return;const principal=Number(appData.amount||0);const months=Number(appData.duration_months||1);const rate=Number(appData.interest_rate||10);const interest=principal*(rate/100)*months;const total=principal+interest;const {data:cust}=await supabaseClient.from("customers").select("full_name").eq("id",appData.customer_id).maybeSingle();const name=cust?.full_name||'Mteja';if(!confirm(`Approve ${name} ${money(total)}?`))return;await supabaseClient.from("loan_applications").update({status:'approved'}).eq("id",id);await supabaseClient.from("loans").insert([{customer_id:appData.customer_id,customer_name:name,loan_amount:principal,interest_amount:interest,total_amount:total,loan_status:'active',duration_months:months,interest_rate:rate,application_id:id,approved_by_email:currentUser.email,approved_by_name:currentUser.name}]);await autoAddToReport('mikopo_iliyotolewa',principal);alert(`Approved na ${currentUser.name} - Imeingia kwenye MIKOPO ILIYOTOLEWA`);loadApplications();loadActiveLoans();loadReports();}
window.rejectApplication=async function(id){await supabaseClient.from("loan_applications").update({status:'rejected'}).eq("id",id);loadApplications();}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const email=$("email").value.trim(),pass=$("password").value;$("message").textContent="Inaingia...";const {data,error}=await supabaseClient.auth.signInWithPassword({email:email,password:pass});if(error){$("message").textContent=error.message;return;}const {data:officer}=await supabaseClient.from("officers").select("*").eq("email",email).maybeSingle();currentUser={email:email,name:officer?.full_name||email,branch:officer?.branch_name||'Kiriba Branch',role:officer?.role||'officer'};$("loginPage").style.display="none";$("app").style.display="block";$("welcomeEmail").textContent=currentUser.name+" ("+currentUser.branch+")";$("todayDate").textContent=new Date().toLocaleDateString();$("reportDate").value=new Date().toISOString().slice(0,10);$("paymentDate").value=new Date().toISOString().slice(0,10);await loadCustomers();await loadApplications();await loadActiveLoans();await loadReports();});
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();location.reload();});
document.querySelectorAll(".menu button").forEach(b=>b.addEventListener("click",()=>showSection(b.dataset.section)));
["searchCustomer","searchApp","searchLoan"].forEach(id=>{const el=$(id);if(el)el.addEventListener("input",()=>{if(id==="searchCustomer")loadCustomers();if(id==="searchApp")loadApplications();if(id==="searchLoan")loadActiveLoans();});});
document.addEventListener("input",e=>{if(e.target.id&&e.target.id.startsWith("r"))calcLive();if(["appAmount","appMonths","appInterest"].includes(e.target.id)){const amt=Number($("appAmount")?.value||0);const m=Number($("appMonths")?.value||1);const r=Number($("appInterest")?.value||10);$("totalPreview").innerHTML=`Jumla: ${money(amt+amt*(r/100)*m)}`;}});
$("addCustomerBtn").addEventListener("click",async()=>{if(!$("cName").value.trim()||!$("cPhone").value.trim())return alert("Jina na Phone required");const branch=$("cBranch").value||currentUser.branch;const {error}=await supabaseClient.from("customers").insert([{full_name:$("cName").value,phone:$("cPhone").value,customer_number:$("cNumber").value,guarantor_name:$("cGuarantorName").value,guarantor_phone:$("cGuarantorPhone").value,branch_name:branch,served_by_email:currentUser.email,served_by_name:currentUser.name}]);if(error)alert(error.message);else{alert(`Amehifadhiwa ${branch} na ${currentUser.name}`);$("cName").value="";$("cPhone").value="";loadCustomers();}});
$("addAppBtn").addEventListener("click",async()=>{const cid=$("appCustomer").value;if(!cid)return alert("Chagua mteja");const amt=Number($("appAmount").value||0);const months=Number($("appMonths").value||1);const rate=Number($("appInterest").value||10);const interest=amt*(rate/100)*months;const total=amt+interest;await supabaseClient.from("loan_applications").insert([{customer_id:cid,amount:amt,duration_months:months,interest_rate:rate,interest_amount:interest,total_amount:total,status:'pending'}]);alert("Maombi yametumwa");loadApplications();});
$("payBtn").addEventListener("click",async()=>{const loanId=$("paymentLoan").value;const amt=Number($("paymentAmount").value||0);const fine=Number($("paymentFine").value||0);if(!loanId||!amt)return alert("Chagua mkopo");const btn=$("payBtn");btn.textContent="INAHIFADHI...";btn.disabled=true;try{await supabaseClient.from("payments").insert([{loan_id:loanId,amount:amt,payment_date:$("paymentDate").value,payment_method:$("paymentMethod").value,fine_amount:fine}]);await autoAddToReport('sales',amt);if(fine>0)await autoAddToReport('fine',fine);alert(`Malipo ${money(amt)} yameingia auto kwenye ripoti ya ${currentUser.branch}`);$("paymentAmount").value="";await loadActiveLoans();await loadReports();}catch(e){alert(e.message);}finally{btn.textContent="HIFADHI + AUTO RIPOTI";btn.disabled=false;}});
$("addOfficerBtn").addEventListener("click",async()=>{const name=$("oName").value,email=$("oEmail").value,pass=$("oPass").value,branch=$("oBranch").value;if(!email||!pass)return alert("Email na Pass");if(!branch)return alert("Chagua kituo");const {data:sign}=await supabaseClient.auth.signUp({email,password:pass});await supabaseClient.from("officers").insert([{full_name:name,email,phone:$("oPhone").value,role:$("oRole").value,branch_name:branch,user_id:sign?.user?.id}]);$("officerMsg").textContent=`Ameongezwa ${branch}`;});
$("saveDailyReport").addEventListener("click",async()=>{const live=calcLive();const row={report_date:$("reportDate").value,sales:Number($("rSales").value||0),fine:Number($("rFine").value||0),other_income:Number($("rOtherIncome").value||0),total_income:live.inc,md:Number($("rMd").value||0),store:Number($("rStore").value||0),bank:Number($("rBank").value||0),transport:Number($("rTransport").value||0),food:Number($("rFood").value||0),communication:Number($("rCommunication").value||0),maintenance:Number($("rMaintenance").value||0),other_expense:Number($("rOtherExpense").value||0),mikopo_iliyotolewa:Number($("rMikopo").value||0),total_expense:live.exp,balance:live.bal,branch_name:currentUser.branch,reported_by_email:currentUser.email,reported_by_name:currentUser.name};await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date,branch_name"});$("reportMsg").textContent=`Imehifadhiwa ${money(row.balance)} - ${currentUser.branch}`;loadReports();});
async function loadOfficers(){}
$("exportAllBtn").addEventListener("click",()=>{let csv="Name,Phone,Branch,ServedBy,Amount,Total\n";allCustomers.forEach(c=>{csv+=`${c.full_name},${c.phone},${c.branch_name},${c.served_by_name},,,\n`});const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ghantende_v7_'+new Date().toISOString().slice(0,10)+'.csv';a.click();});
</script></body></html>
