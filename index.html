<!DOCTYPE html><html lang="sw"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>GHANTENDE FINAL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:linear-gradient(135deg,#064e3b,#0f766e)}button{border:0;border-radius:9px;padding:12px 16px;background:#047857;color:#fff;font-weight:bold;cursor:pointer}input,select,textarea{width:100%;padding:13px;border:1px solid #ccc;border-radius:9px;margin:6px 0 14px}label{font-weight:bold}#loginPage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{width:100%;max-width:410px;background:#fff;border-radius:18px;padding:30px 24px}.logo{width:75px;height:75px;margin:0 auto 15px;border-radius:50%;background:#047857;color:#fff;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold}#app{display:none;min-height:100vh;background:#f3f4f6}header{background:#065f46;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;position:sticky;top:0}.logout{background:#dc2626}.menu{background:#fff;display:flex;gap:8px;padding:10px;overflow-x:auto}.menu button{background:#e5e7eb;color:#222}.menu button.active{background:#047857;color:#fff}.section{display:none;padding:18px;max-width:1100px;margin:auto}.section.active{display:block}.welcome{background:#047857;color:#fff;padding:16px;border-radius:13px;margin-bottom:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.card{background:#fff;padding:19px;border-radius:14px;cursor:pointer}.card strong{font-size:28px;color:#047857}.form-box,.table-box{background:#fff;padding:18px;border-radius:14px;margin-top:10px}.secondary{background:#666}.customer,.application{padding:14px 0;border-bottom:1px solid #ddd}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#ecfdf5;color:#065f46;font-size:12px;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.edit-btn{background:#2563eb}.delete-btn{background:#dc2626}</style></head><body>
<div id="loginPage"><div class="login-box"><div class="logo">GM</div><h1>GHANTENDE</h1><p style="text-align:center">V3 FINAL AUTO REPORT</p><form id="loginForm"><label>Gmail</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button id="loginButton" style="width:100%">INGIA</button><div id="message" style="text-align:center;margin-top:10px;font-weight:bold"></div></form></div></div>
<div id="app"><header><h2>GHANTENDE</h2><button id="logoutButton" class="logout">TOKA</button></header><div class="menu"><button class="active" data-section="dashboard">Dashboard</button><button data-section="wateja">Wateja</button><button data-section="maombi">Maombi</button><button data-section="mikopo">Mikopo Active</button><button data-section="marejesho">Marejesho</button><button data-section="ratiba">Ratiba</button><button data-section="ripoti">Ripoti</button><button data-section="maafisa">Maafisa</button><button id="usersMenu" data-section="watumiaji" style="display:none">Watumiaji</button></div>
<section id="dashboard" class="section active"><div class="welcome">Karibu <b id="welcomeEmail"></b><div id="adminBadge" style="display:none;margin-top:10px;background:#ecfdf5;color:#065f46;padding:8px;border-radius:8px">ADMIN: <span id="adminName"></span></div></div><div class="cards"><div class="card" data-page="customersPage"><h3>Wateja</h3><strong id="customerCount">0</strong></div><div class="card" data-page="applicationsPage"><h3>Pending</h3><strong id="pendingCount">0</strong></div><div class="card" data-page="activeLoansPage"><h3>Active</h3><strong id="activeLoanCount">0</strong></div><div class="card" data-page="balancePage"><h3>Salio</h3><strong id="loanBalance">0</strong></div></div></section>
<section id="wateja" class="section"><div class="page-header"><h2>Wateja</h2><button id="addCustomerButton">+ ONGEZA</button></div><div class="table-box"><div id="customersList"></div></div></section>
<section id="addCustomerPage" class="section"><div class="page-header"><h2>Ongeza Mteja</h2><button class="secondary" id="backCustomersButton">RUDI</button></div><div class="form-box"><form id="customerForm"><label>No</label><input id="customerNumber" readonly><label>Jina</label><input id="fullName" required><label>Simu</label><input id="phone" required><label>ID</label><input id="nationalId"><label>Address</label><input id="address"><button type="submit">HIFADHI</button><div id="customerMessage"></div></form></div></section>
<section id="maombi" class="section"><h2>Maombi</h2><div class="form-box"><form id="loanForm"><label>Mteja</label><select id="loanCustomer" required><option value="">--</option></select><label>Kiasi</label><input id="loanAmount" type="number" required><label>Sababu</label><textarea id="loanPurpose"></textarea><button type="submit">TUMA</button><div id="loanMessage"></div></form></div><div class="table-box"><div id="applicationsList"></div></div></section>
<section id="mikopo" class="section"><h2>Mikopo Active</h2><div class="table-box"><div id="activeLoansList"></div></div></section>
<section id="marejesho" class="section"><h2>Marejesho - AUTO RIPOTI</h2><div class="form-box"><form id="paymentForm"><label>Mkopo</label><select id="paymentLoan" required><option value="">--</option></select><label>Kiasi</label><input id="paymentAmount" type="number" required><label>Tarehe</label><input id="paymentDate" type="date" required><label>Njia</label><select id="paymentMethod"><option>Cash</option><option>Bank</option><option>Mobile Money</option></select><button type="submit">HIFADHI - ITAINGIA RIPOTI AUTOMATIC</button><div id="paymentMessage"></div></form></div><div class="table-box"><input id="paymentSearch" placeholder="Tafuta"><div id="paymentsList"></div></div></section>
<section id="ratiba" class="section"><h2>Ratiba</h2><div class="table-box"><div id="schedulesList"></div></div></section>
<section id="ripoti" class="section"><h2>RIPOTI AUTO</h2><div class="form-box"><label>Tarehe</label><input id="reportDate" type="date"><button id="saveDailyReport" style="width:100%">HIFADHI</button><div id="reportMessage"></div></div><div class="table-box"><div id="reportsList"></div></div></section>
<section id="maafisa" class="section"><h2>Maafisa</h2><div class="table-box"><div id="maafisaList"></div></div></section>
<section id="watumiaji" class="section"><h2>Watumiaji</h2><div class="table-box"><div id="usersList"></div></div></section>
<section id="customersPage" class="section"><div class="page-header"><h2>Wateja</h2><button class="secondary homeButton">RUDI</button></div><div class="table-box"><div id="customersPageList"></div></div></section>
<section id="applicationsPage" class="section"><div class="page-header"><h2>Maombi</h2><button class="secondary homeButton">RUDI</button></div><div class="table-box"><div id="applicationsList2"></div></div></section>
<section id="activeLoansPage" class="section"><div class="page-header"><h2>Mikopo Active</h2><button class="secondary homeButton">RUDI</button></div><div class="table-box"><div id="activeLoansPageList"></div></div></section>
<section id="balancePage" class="section"><h2>Salio</h2><div class="table-box"><strong id="balanceTotal" style="font-size:28px">TZS 0</strong></div></section>
</div>
<script>
const SUPABASE_URL="https://kvcbsebklyuupwixmagd.supabase.co";const SUPABASE_ANON_KEY="sb_publishable_CaipCB_cvv1uPsqtt4Yalg_cFWGSP2t";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);function esc(v){return String(v??"").replace(/[&<>'"]/g,m=>({"&":"&amp;"}[m]))}function money(v){return "TZS "+Number(v||0).toLocaleString()}function showSection(id){document.querySelectorAll(".section").forEach(s=>s.classList.remove("active"));$(id).classList.add("active")}
let currentOfficer=null,isAdmin=false;async function loadOfficerRole(u=null){try{let user=u;if(!user){const r=await supabaseClient.auth.getUser();user=r.data?.user}if(!user)return;const {data:officer}=await supabaseClient.from("officers").select("id,full_name,email,role,user_id").eq("user_id",user.id).maybeSingle();currentOfficer=officer;isAdmin=String(officer?.role||"").toLowerCase()==="admin";$("adminBadge").style.display=isAdmin?"block":"none";$("adminName").textContent=officer?.full_name||"";$("usersMenu").style.display=isAdmin?"block":"none"}catch(e){isAdmin=false}}function requireAdmin(){if(!isAdmin){alert("ADMIN tu!");return false}return true}
async function autoAddToReport(type,amount,date){const rDate=date||new Date().toISOString().slice(0,10);const {data}=await supabaseClient.from("daily_reports").select("*").eq("report_date",rDate).maybeSingle();let row=data||{report_date:rDate,sales:0,fine:0,other_income:0,total_income:0,md:0,store:0,bank:0,transport:0,food:0,communication:0,maintenance:0,other_expense:0,total_expense:0,balance:0};if(type==='payment')row.sales+=Number(amount);row.total_income=Number(row.sales||0)+Number(row.fine||0)+Number(row.other_income||0);row.total_expense=Number(row.md||0)+Number(row.store||0)+Number(row.bank||0)+Number(row.transport||0)+Number(row.food||0)+Number(row.communication||0)+Number(row.maintenance||0)+Number(row.other_expense||0);row.balance=row.total_income-row.total_expense;await supabaseClient.from("daily_reports").upsert(row,{onConflict:"report_date"});}
let appLoading=false;async function showApp(user){if(appLoading)return;appLoading=true;$("loginPage").style.display="none";$("app").style.display="block";$("welcomeEmail").textContent=user?.email||"";await loadOfficerRole(user);showSection("dashboard");await loadDashboard();appLoading=false}function showLogin(){$("loginPage").style.display="flex";$("app").style.display="none"}
document.getElementById("loginForm").addEventListener("submit",async e=>{e.preventDefault();const {data,error}=await supabaseClient.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("message").textContent=error.message;return}await showApp(data.user)});
$("logoutButton").addEventListener("click",async()=>{await supabaseClient.auth.signOut();showLogin()});
document.querySelectorAll(".menu button").forEach(b=>{b.addEventListener("click",async()=>{showSection(b.dataset.section);if(b.dataset.section==="wateja")await loadCustomers();if(b.dataset.section==="maombi"){await loadCustomerOptions();await loadPendingApplications()}if(b.dataset.section==="mikopo")await loadActiveLoans();if(b.dataset.section==="maafisa")await loadMaafisa();if(b.dataset.section==="marejesho"){await loadPaymentLoans();await loadPayments()}if(b.dataset.section==="ripoti")await loadReports()})});
async function loadDashboard(){await loadCustomers();await loadPendingApplications();await loadActiveLoans()}
async function loadCustomers(){const {data}=await supabaseClient.from("customers").select("*").order("id",{ascending:false});$("customerCount").textContent=data?.length||0;const html=data.map((c,i)=>{let btns=isAdmin?`<div class="actions"><button class="edit-btn" onclick="editCustomer('${c.id}')">HARIRI</button><button class="delete-btn" onclick="deleteCustomer('${c.id}')">FUTA</button></div>`:`<div style="font-size:11px;color:#888">View only</div>`;return `<div class="customer"><b>${i+1}. ${esc(c.full_name)}</b><br>${esc(c.customer_number)} | ${esc(c.phone)}${btns}</div>`}).join("");$("customersList").innerHTML=html;if($("customersPageList"))$("customersPageList").innerHTML=html;await loadCustomerOptions(data)}
async function loadCustomerOptions(customers){if(!customers){const r=await supabaseClient.from("customers").select("id,full_name").order("full_name");customers=r.data||[]}$("loanCustomer").innerHTML='<option value="">--</option>'+customers.map(c=>`<option value="${c.id}">${esc(c.full_name)}</option>`).join("")}
async function loadPendingApplications(){const {data}=await supabaseClient.from("loan_applications").select("*").order("id",{ascending:false});$("pendingCount").textContent=data?.filter(a=>a.status==="pending").length||0;const html=data.map((a,i)=>{let btn=isAdmin?`<div class="actions"><button onclick="approveApplication('${a.id}')">APPROVE</button><button class="delete-btn" onclick="deleteApplication('${a.id}')">FUTA</button></div>`:"";return `<div class="application"><b>${i+1}</b> ${money(a.amount)} ${esc(a.status)}${btn}</div>`}).join("");$("applicationsList").innerHTML=html;if($("applicationsList2"))$("applicationsList2").innerHTML=html;}
async function approveApplication(id){if(!requireAdmin())return;await supabaseClient.rpc("approve_loan",{p_application_id:id});loadPendingApplications();loadActiveLoans()}async function deleteApplication(id){if(!requireAdmin())return;await supabaseClient.from("loan_applications").delete().eq("id",id);loadPendingApplications()}
async function getActiveLoansWithBalances(){const {data:loans}=await supabaseClient.from("loans").select("*").eq("loan_status","active").order("id",{ascending:false});const ids=(loans||[]).map(x=>x.id);let payments=[];if(ids.length){const r=await supabaseClient.from("payments").select("loan_id,amount").in("loan_id",ids);payments=r.data||[]}return (loans||[]).map(l=>{const paid=payments.filter(p=>p.loan_id===l.id).reduce((a,p)=>a+Number(p.amount||0),0);return {...l,paid,balance:Math.max(0,Number(l.total_amount||0)-paid)}})}
async function loadActiveLoans(){const loans=await getActiveLoansWithBalances();$("activeLoanCount").textContent=loans.length;const total=loans.reduce((s,l)=>s+l.balance,0);$("loanBalance").textContent=money(total);$("balanceTotal").textContent=money(total);$("activeLoansList").innerHTML=loans.map((l,i)=>`<div class="application"><b>${i+1}</b> ${esc(l.customer_name||"")} Salio ${money(l.balance)} ${isAdmin?`<button class="delete-btn" onclick="deleteLoan('${l.id}')">FUTA</button>`:""}</div>`).join("")}
async function loadMaafisa(){const {data}=await supabaseClient.from("officers").select("*").order("created_at",{ascending:false});$("maafisaList").innerHTML=data.map((u,i)=>`<div class="application"><b>${i+1}. ${esc(u.full_name)}</b> ${esc(u.email)} ${isAdmin?`<button class="delete-btn" onclick="deleteOfficer('${u.id}')">FUTA</button>`:""}</div>`).join("")}
async function loadPaymentLoans(){const loans=await getActiveLoansWithBalances();$("paymentLoan").innerHTML='<option value="">--</option>'+loans.map(l=>`<option value="${l.id}">${esc(l.customer_name||"")} - ${money(l.balance)}</option>`).join("")}
async function loadPayments(){const {data}=await supabaseClient.from("payments").select("*").order("payment_date",{ascending:false});$("paymentsList").innerHTML=data.map((p,i)=>`<div class="application">${i+1}. ${money(p.amount)} ${esc(p.payment_date)} ${isAdmin?`<button class="delete-btn" onclick="deletePayment('${p.id}')">FUTA</button>`:""}</div>`).join("")}
async function loadReports(){const {data}=await supabaseClient.from("daily_reports").select("*").order("report_date",{ascending:false});$("reportsList").innerHTML=data.map((r,i)=>`<div class="application">${i+1}. ${esc(r.report_date)} Mapato ${money(r.total_income)} Salio ${money(r.balance)} ${isAdmin?`<button class="delete-btn" onclick="deleteReport('${r.report_date}')">FUTA</button>`:""}</div>`).join("")}
async function deleteCustomer(id){if(!requireAdmin())return;await supabaseClient.from("customers").delete().eq("id",id);loadCustomers()}async function editCustomer(id){if(!requireAdmin())return;const {data}=await supabaseClient.from("customers").select("*").eq("id",id).single();const n=prompt("Jina:",data.full_name);if(!n)return;await supabaseClient.from("customers").update({full_name:n}).eq("id",id);loadCustomers()}async function deleteOfficer(id){if(!requireAdmin())return;await supabaseClient.from("officers").delete().eq("id",id);loadMaafisa()}async function deleteLoan(id){if(!requireAdmin())return;await supabaseClient.from("loans").delete().eq("id",id);loadActiveLoans()}async function deletePayment(id){if(!requireAdmin())return;await supabaseClient.from("payments").delete().eq("id",id);loadPayments()}async function deleteReport(d){if(!requireAdmin())return;await supabaseClient.from("daily_reports").delete().eq("report_date",d);loadReports()}
$("addCustomerButton").addEventListener("click",()=>{showSection("addCustomerPage");$("customerNumber").value="CUS-"+Date.now().toString().slice(-8)});$("backCustomersButton").addEventListener("click",()=>{showSection("wateja");loadCustomers()});
$("customerForm").addEventListener("submit",async e=>{e.preventDefault();await supabaseClient.from("customers").insert([{customer_number:$("customerNumber").value,full_name:$("fullName").value,phone:$("phone").value,national_id:$("nationalId").value||null,address:$("address").value||null}]);$("customerMessage").textContent="Amehifadhiwa";loadCustomers();setTimeout(()=>showSection("wateja"),500)});
$("paymentDate").value=new Date().toISOString().slice(0,10);$("reportDate").value=new Date().toISOString().slice(0,10);
$("loanForm").addEventListener("submit",async e=>{e.preventDefault();const {data:auth}=await supabaseClient.auth.getUser();const {data:officer}=await supabaseClient.from("officers").select("id").eq("user_id",auth.user.id).maybeSingle();await supabaseClient.from("loan_applications").insert([{customer_id:$("loanCustomer").value,officer_id:officer.id,amount:Number($("loanAmount").value),purpose:$("loanPurpose").value,application_date:new Date().toISOString().slice(0,10),status:"pending"}]);$("loanMessage").textContent="Imetumwa";loadPendingApplications()});
$("paymentForm").addEventListener("submit",async e=>{e.preventDefault();if(!requireAdmin())return;const amt=Number($("paymentAmount").value);const pdate=$("paymentDate").value;const {error}=await supabaseClient.from("payments").insert([{loan_id:$("paymentLoan").value,amount:amt,payment_date:pdate,payment_method:$("paymentMethod").value}]);if(error){$("paymentMessage").textContent=error.message;return}await autoAddToReport('payment',amt,pdate);$("paymentMessage").textContent="✅ Imehifadhiwa na imeingia Ripoti ya "+pdate;loadPayments();loadActiveLoans();loadReports();});
</script></body></html>
